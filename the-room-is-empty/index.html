<style>
/* ============================================================
   NOCTURNE OF GLASS CURRENTS · TRIPTYCH TEST
   Three panels: human lore (L) · audio-reactive ent (C) · clinical console (R)
   Designed for a 4K TV. Built for local audio testing.
   ============================================================ */

:root {
  /* default palette · Track I: dark green (Nocturne of Glass Currents) */
  --void: rgb(5, 10, 8);
  --void-mid: rgb(15, 22, 18);
  --bone: rgb(220, 226, 220);
  --bone-dim: rgba(220, 226, 220, 0.55);
  --bone-faint: rgba(220, 226, 220, 0.18);
  --accent: rgb(122, 184, 110);
  --accent-dim: rgba(122, 184, 110, 0.55);
  --accent-glow: rgba(122, 184, 110, 0.22);
  --console-green: rgb(122, 195, 110);
  --console-amber: rgb(210, 200, 130);
  --console-dim: rgba(122, 195, 110, 0.45);
  --console-faint: rgba(122, 195, 110, 0.18);
  --warn: rgb(220, 110, 90);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--void);
  color: var(--bone);
  font-family: 'Cormorant Garamond', Georgia, serif;
  height: 100vh; width: 100vw;
  overflow: hidden;
  transition: background 1.6s ease;
}

/* ============================================================
   INTAKE · initial file-picker overlay
   ============================================================ */
#intake {
  position: fixed; inset: 0;
  background: var(--void);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3.5vh;
  z-index: 100;
  transition: opacity 1.2s ease, visibility 1.2s ease;
}
#intake.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

/* The web edition opens onto darkness. A single faint word
   appears after a moment; one click anywhere crosses the
   threshold. One gesture, required by browser audio policy,
   kept diegetic: a door was opened to get here, this is the
   step through it. */
#enter-hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.7rem, 0.7vw, 1.5rem);
  letter-spacing: 0.6em;
  text-transform: lowercase;
  color: rgba(220, 226, 220, 0);
  transition: color 4s ease;
  animation: enter-breathe 5s ease-in-out infinite;
  animation-play-state: paused;
}
#intake.waiting { cursor: pointer; }
#intake.waiting #enter-hint {
  color: rgba(220, 226, 220, 0.35);
  animation-play-state: running;
}
@keyframes enter-breathe {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.45; }
}

/* ============================================================
   STAGE · three-column triptych. The row is locked to 100vh so
   that content in any panel can never push the grid taller and
   make the centre canvas grow underneath the ent. Each panel
   then carries its own overflow:hidden so its content cannot
   escape its column either.
   ============================================================ */
#stage {
  display: grid;
  grid-template-columns: 28vw 44vw 28vw;
  grid-template-rows: 100vh;
  height: 100vh;
  width: 100vw;
  opacity: 0;
  transition: opacity 2s ease 0.4s;
}
#stage.live { opacity: 1; }

/* ============================================================
   DREAM VEIL · the two side panels carry the texture of a dream
   the centre does not need. A pseudo-element overlays each panel
   with a faint blurred and SVG-displaced layer, masked so it only
   covers the edges. The mask is an off-centre radial: the cleared
   "lucid" zone sits asymmetrically, so each panel has a different
   corner that catches more of the blur, the lens that doesn't
   quite let you see everything. The mask position drifts very
   slowly so the imperfect corner moves throughout the night.
   ============================================================ */
.panel-left, .panel-right { position: relative; }

.panel-left::after,
.panel-right::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  /* Pull the panel pixels through the blur and the SVG turbulence. */
  backdrop-filter: blur(2.6px);
  -webkit-backdrop-filter: blur(2.6px);
  z-index: 2;
  /* Mix mode keeps the colours of the panel underneath while letting
     the blur do its work. Soft-light leaves the eye believing it sees
     the original prose: it does, with a thin film of dream over it. */
  mix-blend-mode: normal;
  opacity: 0.85;
}

.panel-left::after {
  filter: url(#broken-lens-left);
  /* Lucid window biased toward upper-centre; lower-right corner gets
     the most veil. Edges are not symmetric: the broken lens has a
     direction. */
  -webkit-mask-image: radial-gradient(ellipse 78% 88% at 45% 42%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%);
          mask-image: radial-gradient(ellipse 78% 88% at 45% 42%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%);
  animation: dream-drift-left 64s ease-in-out infinite;
}
.panel-right::after {
  filter: url(#broken-lens-right);
  /* Mirror direction: lucid zone biased toward upper-right; the
     left/lower edge (the one bordering the centre) catches more. */
  -webkit-mask-image: radial-gradient(ellipse 78% 88% at 58% 46%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%);
          mask-image: radial-gradient(ellipse 78% 88% at 58% 46%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%);
  animation: dream-drift-right 72s ease-in-out infinite;
}

/* The mask drifts. The lucid zone moves around very slowly so the
   broken-corner of the lens never stays in the same place. Long
   periods (over a minute) to keep this beneath conscious attention. */
@keyframes dream-drift-left {
  0%   { -webkit-mask-image: radial-gradient(ellipse 78% 88% at 45% 42%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%);
                 mask-image: radial-gradient(ellipse 78% 88% at 45% 42%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%); }
  33%  { -webkit-mask-image: radial-gradient(ellipse 82% 84% at 52% 38%, transparent 58%, rgba(0,0,0,0.55) 82%, black 100%);
                 mask-image: radial-gradient(ellipse 82% 84% at 52% 38%, transparent 58%, rgba(0,0,0,0.55) 82%, black 100%); }
  66%  { -webkit-mask-image: radial-gradient(ellipse 74% 92% at 40% 55%, transparent 52%, rgba(0,0,0,0.55) 78%, black 100%);
                 mask-image: radial-gradient(ellipse 74% 92% at 40% 55%, transparent 52%, rgba(0,0,0,0.55) 78%, black 100%); }
  100% { -webkit-mask-image: radial-gradient(ellipse 78% 88% at 45% 42%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%);
                 mask-image: radial-gradient(ellipse 78% 88% at 45% 42%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%); }
}
@keyframes dream-drift-right {
  0%   { -webkit-mask-image: radial-gradient(ellipse 78% 88% at 58% 46%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%);
                 mask-image: radial-gradient(ellipse 78% 88% at 58% 46%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%); }
  33%  { -webkit-mask-image: radial-gradient(ellipse 84% 80% at 50% 52%, transparent 60%, rgba(0,0,0,0.55) 82%, black 100%);
                 mask-image: radial-gradient(ellipse 84% 80% at 50% 52%, transparent 60%, rgba(0,0,0,0.55) 82%, black 100%); }
  66%  { -webkit-mask-image: radial-gradient(ellipse 72% 90% at 62% 40%, transparent 50%, rgba(0,0,0,0.55) 78%, black 100%);
                 mask-image: radial-gradient(ellipse 72% 90% at 62% 40%, transparent 50%, rgba(0,0,0,0.55) 78%, black 100%); }
  100% { -webkit-mask-image: radial-gradient(ellipse 78% 88% at 58% 46%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%);
                 mask-image: radial-gradient(ellipse 78% 88% at 58% 46%, transparent 55%, rgba(0,0,0,0.55) 80%, black 100%); }
}

/* ---- LEFT: lore ----------------------------------------- */
.panel-left {
  padding: 6vh 2.8vw;
  display: flex; flex-direction: column;
  justify-content: flex-start;
  position: relative;
  border-right: 1px solid var(--bone-faint);
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  box-sizing: border-box;
}
.panel-left .lore-roman {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(1.8rem, 2.4vw, 5.5rem);
  font-style: italic; font-weight: 300;
  color: var(--accent);
  line-height: 1.08;
  letter-spacing: 0.005em;
  margin-bottom: 4vh;
  flex: 0 0 auto;
  transition: color 1.4s ease, opacity 3s ease;
}
.panel-left .lore-body {
  /* Fills remaining vertical space. Overflow is hidden and the
     typewriter scrolls this element each frame so the cursor stays
     anchored around 55% from the top, with previous text gliding up. */
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
  font-size: clamp(1.05rem, 1.05vw, 2.4rem);
  line-height: 1.75;
  font-weight: 300;
  color: var(--bone);
  letter-spacing: 0.005em;
  opacity: 0;
  transition: opacity 1.5s ease;
}
.panel-left .lore-body.live { opacity: 1; }
.panel-left .lore-body.fading { opacity: 0; transition: opacity 2.2s ease; }
.panel-left .lore-body p {
  margin: 0 0 1.4em 0;
  min-height: 1.4em;
}
.panel-left .lore-body em { font-style: italic; color: var(--bone); }
.panel-left .lore-body .tw-cursor {
  display: inline-block;
  width: 0.55em;
  margin-left: 0.05em;
  color: var(--accent);
  animation: tw-blink 1.05s steps(2) infinite;
  vertical-align: baseline;
  font-style: normal;
}
@keyframes tw-blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.15; }
}

/* ----------------------------------------------------------------
   Decayed words: chars vanish but the space they occupied remains,
   so the sentence keeps its shape with a hole where meaning used to
   be. The disappearance is announced by two small vibrations and
   then a slow fade, like a word noticing it is about to be forgotten.
   The final state preserves the layout via visibility:hidden.
   ---------------------------------------------------------------- */
.panel-left .lore-body .tw-decayed {
  display: inline-block;
  animation: tw-decay-vanish 4.2s ease-out forwards;
}
@keyframes tw-decay-vanish {
  0%   { opacity: 1;    color: var(--bone);     transform: translateX(0);    filter: none; }
  18%  { opacity: 1;    color: var(--bone);     transform: translateX(0);    filter: none; }
  /* first tremor */
  22%  { opacity: 0.85; color: var(--bone-dim); transform: translateX(-1px); filter: blur(0.2px); }
  26%  { opacity: 0.95; color: var(--bone);     transform: translateX(1px);  filter: none; }
  30%  { opacity: 0.9;  color: var(--bone);     transform: translateX(0);    filter: none; }
  /* hold */
  48%  { opacity: 0.85; color: var(--bone);     transform: translateX(0);    filter: none; }
  /* second tremor */
  52%  { opacity: 0.7;  color: var(--bone-dim); transform: translateX(1px);  filter: blur(0.3px); }
  56%  { opacity: 0.85; color: var(--bone);     transform: translateX(-1px); filter: blur(0.15px); }
  60%  { opacity: 0.7;  color: var(--bone-dim); transform: translateX(0);    filter: none; }
  /* slow fade */
  100% { opacity: 0;    color: var(--bone-dim); transform: translateX(0);    filter: blur(1px); }
}
/* Identical end-state but no animation. Used once the animation has
   played, so that further re-renders of the paragraph (whenever the
   typewriter adds another char or the phantom contagion fires)
   don't restart the vibration sequence. */
.panel-left .lore-body .tw-decayed-settled {
  visibility: hidden;
}

/* ----------------------------------------------------------------
   Phantom contagion: when the 5-8 kHz band spikes, one word in the
   current paragraph gets infected by the centre's phantom layer.
   It flickers through colours and faces for half a second, then
   settles into its altered state: a monospaced ghost that no longer
   belongs to the surrounding serif prose, as if a word from the
   middle panel had slipped through the membrane.
   ---------------------------------------------------------------- */
.panel-left .lore-body .tw-phantom {
  display: inline-block;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  color: var(--accent);
  letter-spacing: 0.05em;
  animation: tw-phantom-glitch 0.55s steps(7, end) 1;
  text-shadow: 0 0 6px rgba(122, 184, 110, 0.45);
  font-style: normal;
}
@keyframes tw-phantom-glitch {
  0%   { color: var(--bone);   transform: translateX(0);    filter: none; }
  14%  { color: var(--accent); transform: translateX(-1px); filter: blur(0.4px); }
  28%  { color: var(--bone);   transform: translateX(1px); }
  42%  { color: var(--accent); transform: translateX(-1px); filter: blur(0.6px); }
  56%  { color: rgb(210, 200, 130); transform: translateX(0); }
  70%  { color: var(--accent); transform: translateX(1px);  filter: blur(0.3px); }
  84%  { color: var(--bone);   transform: translateX(0);    filter: none; }
  100% { color: var(--accent); transform: translateX(0);    filter: none; }
}

/* The same word after the glitch has finished. Identical look to the
   final keyframe but no animation, so subsequent re-renders don't
   restart the glitch. The word stays as a ghost embedded in the prose. */
.panel-left .lore-body .tw-phantom-settled {
  display: inline-block;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  color: var(--accent);
  letter-spacing: 0.05em;
  text-shadow: 0 0 6px rgba(122, 184, 110, 0.45);
  font-style: normal;
}

/* ---- CENTER: ent ---------------------------------------- */
.panel-center {
  position: relative;
  background: var(--void);
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  box-sizing: border-box;
}
#ent {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
}
.center-title {
  position: absolute;
  top: 4vh; left: 50%; transform: translateX(-50%);
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(0.95rem, 1.05vw, 2.4rem);
  font-style: italic; font-weight: 300;
  letter-spacing: 0.18em;
  color: var(--bone-dim);
  pointer-events: none;
  white-space: nowrap;
  transition: color 1.4s ease;
}

/* ---- RIGHT: console ------------------------------------ */
.panel-right {
  padding: 3.5vh 1.6vw;
  border-left: 1px solid var(--bone-faint);
  display: grid;
  grid-template-rows: auto auto auto auto auto;
  gap: 2vh;
  font-family: 'JetBrains Mono', monospace;
  color: var(--console-green);
  font-size: clamp(0.8rem, 0.7vw, 1.7rem);
  overflow: hidden;
  min-width: 0;
  min-height: 0;
  box-sizing: border-box;
  position: relative;
  /* Chromatic whisper: the centre's hue (per track) bleeds into the
     left edge of the console as an almost-invisible wash. Just enough
     that across track changes the eye picks up a faint synchrony with
     the entity's atmosphere, without ever turning the right panel
     into anything other than its phosphor-green machine self. */
  background-image: linear-gradient(90deg, var(--accent-soft) 0%, transparent 35%);
}
/* Each block is its own contained box: cannot push its row taller
   than the auto cell allows, cannot push the panel wider than 28vw. */
.panel-right > div {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  box-sizing: border-box;
}

.console-header {
  display: flex; justify-content: space-between;
  font-size: clamp(0.7rem, 0.55vw, 1.4rem);
  letter-spacing: 0.35em; text-transform: uppercase;
  color: var(--console-dim);
  margin-bottom: 0.4vh;
  /* A thin chromatic underscore at every block header: a hairline of
     the current track's hue underneath the verde-fósforo lettering. */
  padding-bottom: 0.4vh;
  border-bottom: 1px solid var(--accent-bleed);
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
}
.console-header > span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

/* ECG monitor */
.ecg-block { display: flex; flex-direction: column; gap: 0.4vh; }
.ecg-wrap {
  height: 22vh;
  border: 1px solid var(--console-faint);
  background: rgba(122, 195, 110, 0.03);
  position: relative;
}
#ecg { width: 100%; height: 100%; display: block; }

/* IRT bars */
.irt-block { display: flex; flex-direction: column; gap: 0.4vh; }
.irt-wrap {
  height: 14vh;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0.4vw;
  padding: 0.4vh 0;
}
.irt-meter {
  display: flex; flex-direction: column;
  align-items: center;
  position: relative;
}
.irt-meter .col {
  flex: 1; width: 100%;
  background: rgba(122, 195, 110, 0.06);
  position: relative;
  border: 1px solid var(--console-faint);
}
.irt-meter .col .fill {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--console-green);
  height: 0;
  transition: height 50ms linear;
}
.irt-meter .col .peak {
  position: absolute; left: 0; right: 0;
  height: 1px;
  background: var(--console-amber);
  bottom: 0;
}
.irt-meter .label {
  font-size: clamp(0.65rem, 0.5vw, 1.3rem);
  letter-spacing: 0.15em;
  color: var(--console-dim);
  margin-top: 0.5vh;
  text-transform: uppercase;
}

/* Memory dump */
.mem-block { display: flex; flex-direction: column; gap: 0.4vh; min-height: 0; }
.mem-wrap {
  height: 18vh;
  overflow: hidden;
  font-size: clamp(0.75rem, 0.62vw, 1.55rem);
  line-height: 1.55;
  letter-spacing: 0.05em;
  position: relative;
  color: var(--console-dim);
}
.mem-line { white-space: nowrap; }
.mem-line.hot { color: var(--console-amber); }
.mem-line .addr { color: var(--console-faint); margin-right: 0.6em; }
.mem-line .bits { color: var(--console-dim); }
.mem-line.hot .bits { color: var(--console-amber); }
.mem-line .reveal {
  margin-left: 0.8em;
  color: var(--accent);
  opacity: 0;
  transition: opacity 0.4s;
}
.mem-line.hot .reveal { opacity: 1; }

/* System messages */
.msg-block { display: flex; flex-direction: column; gap: 0.4vh; min-height: 0; }
.msg-wrap {
  height: 12vh;
  overflow: hidden;
  font-size: clamp(0.75rem, 0.62vw, 1.55rem);
  line-height: 1.55;
  letter-spacing: 0.04em;
}
.msg-line {
  color: var(--console-green);
  opacity: 0.85;
  transition: opacity 1s;
}
.msg-line .ts { color: var(--console-faint); margin-right: 0.5em; }
.msg-line.warn { color: var(--warn); }
.msg-line.fade { opacity: 0.25; }

/* Glitch counters · the ECG-adjacent vital numbers */
.counters-block { display: flex; flex-direction: column; gap: 0.4vh; }
.counters-wrap {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.8vw;
}
.ctr {
  display: flex; flex-direction: column;
  align-items: flex-start;
  padding: 0.6vh 0.5vw;
  border: 1px solid var(--console-faint);
  background: rgba(122, 195, 110, 0.025);
  transition: background 80ms, border-color 80ms;
}
.ctr.pulse {
  background: rgba(122, 195, 110, 0.18);
  border-color: var(--console-green);
}
.ctr .ctr-label {
  font-size: clamp(0.65rem, 0.5vw, 1.3rem);
  letter-spacing: 0.2em;
  color: var(--console-dim); text-transform: uppercase;
}
.ctr .ctr-value {
  font-size: clamp(1.6rem, 1.4vw, 3.4rem);
  color: var(--console-green);
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  margin-top: 0.2vh;
}

/* ============================================================
   BEGIN button: paired main + hint, opens with double-click
   ============================================================ */

audio { display: none; }

/* ============================================================
   STAGE VISIBILITY · per-panel show/hide for presentation
   ============================================================ */

/* Left panel: title stays invisible until a track is active.
   typewriter handles .lore-body separately via its own live state.
   The transition is slow so leaving rest does not feel abrupt. */
.panel-left .lore-roman {
  opacity: 0;
}
.panel-left.live .lore-roman { opacity: 1; }

/* Right panel: each console block hidden initially, revealed in
   staggered cascade during the wake-up coreography. After they
   appear they remain present, even across track changes. The
   resting state does not hide them; it only slows their tempo. */
.panel-right .ecg-block,
.panel-right .counters-block,
.panel-right .irt-block,
.panel-right .mem-block,
.panel-right .msg-block {
  opacity: 0;
  transition: opacity 2s ease;
}
.panel-right.cascade .mem-block       { transition-delay: 0s;    opacity: 1; }
.panel-right.cascade .ecg-block       { transition-delay: 1.4s;  opacity: 1; }
.panel-right.cascade .counters-block  { transition-delay: 2.8s;  opacity: 1; }
.panel-right.cascade .irt-block       { transition-delay: 4.2s;  opacity: 1; }
.panel-right.cascade .msg-block       { transition-delay: 5.6s;  opacity: 1; }

/* ============================================================
   PRESENTATION OVERLAY · large title + author, fade in/out
   only during the first awakening of the session. Lives above
   the stage but transparent so the centre ent shows through.
   ============================================================ */
#presentation {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2.4vh;
  z-index: 60;
  pointer-events: none;
  opacity: 1;
}
/* Title and author fade independently: the name of the work must
   stand over absolute black, with nothing behind it; the author
   follows; only after both have gone does the veil lift and the
   central entity emerge. Order is dramaturgy. */
#presentation-title, #presentation-author {
  opacity: 0;
  transition: opacity 4s ease;
}
#presentation.show-title #presentation-title { opacity: 1; }
#presentation.show-author #presentation-author { opacity: 1; }
#presentation.fading { opacity: 0; transition: opacity 3s ease; }
#presentation-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300; font-style: italic;
  font-size: clamp(2.6rem, 4.4vw, 10rem);
  letter-spacing: 0.04em;
  text-align: center;
  color: rgb(220, 226, 220);
  line-height: 1.05;
  max-width: 90vw;
}
#presentation-author {
  font-family: 'JetBrains Mono', monospace;
  font-size: clamp(0.85rem, 0.85vw, 1.9rem);
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: rgba(220, 226, 220, 0.55);
}

/* During the wake-up, a black veil sits over the whole stage and
   lifts gradually so the elements emerge from darkness. */
#wake-veil {
  position: fixed; inset: 0;
  background: rgb(0, 0, 0);
  z-index: 55;
  pointer-events: none;
  opacity: 1;
  transition: opacity 5s ease;
}
#wake-veil.lifted { opacity: 0; }

/* ============================================================
   CLOSING · the farewell sentence after two complete cycles
   "The room is empty now. It always was."
   Appears in the centre of the stage, serif, no cursor, no
   typewriter. Fades in over many seconds, holds, fades out.
   ============================================================ */
#closing-line {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  z-index: 70;
  pointer-events: none;
  opacity: 0;
  transition: opacity 4s ease;
  padding: 0 8vw;
}
#closing-line.visible { opacity: 1; }
#closing-line.blink {
  animation: farewell-blink 1.1s steps(1, end) 1 forwards;
}
@keyframes farewell-blink {
  0%   { opacity: 1; }
  18%  { opacity: 0.12; }
  34%  { opacity: 0.85; }
  52%  { opacity: 0.08; }
  70%  { opacity: 0.6; }
  100% { opacity: 0; }
}
#closing-line p {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-weight: 300; font-style: italic;
  font-size: clamp(1.8rem, 2.6vw, 6rem);
  letter-spacing: 0.02em;
  text-align: center;
  color: rgb(220, 226, 220);
  line-height: 1.4;
  margin: 0;
}

/* The final blackout: covers everything */
#blackout {
  position: fixed; inset: 0;
  background: rgb(0, 0, 0);
  z-index: 80;
  pointer-events: none;
  opacity: 0;
  transition: opacity 6s ease;
}
#blackout.visible { opacity: 1; }
</style>
</head>
<body>

<!-- ============================================================
     DREAM SVG FILTERS · live SVG filter definitions that the
     side-panel pseudo-element overlays consume. Two filters,
     subtly different, so left and right don't feel identical.
     The turbulence baseFrequency animates over very long cycles
     so the displacement breathes imperfectly, like a lens that
     has not quite settled onto reality.
     ============================================================ -->
<svg width="0" height="0" style="position:absolute; pointer-events:none;" aria-hidden="true">
  <defs>
    <filter id="broken-lens-left" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="turb">
        <animate attributeName="baseFrequency"
                 dur="38s"
                 values="0.012 0.018; 0.018 0.011; 0.009 0.022; 0.014 0.015; 0.012 0.018"
                 repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="9" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="broken-lens-right" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.014" numOctaves="2" seed="23" result="turb">
        <animate attributeName="baseFrequency"
                 dur="46s"
                 values="0.016 0.014; 0.010 0.020; 0.020 0.009; 0.013 0.017; 0.016 0.014"
                 repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="9" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
</svg>

<!-- ============================================================
     INTAKE · file pickers for the 4 audios
     ============================================================ -->
<div id="intake">
  <div id="enter-hint">enter</div>
</div>

<!-- ============================================================
     STAGE · three columns
     ============================================================ -->
<div id="stage">

  <!-- LEFT: lore -->
  <section class="panel-left">
    <div class="lore-roman" id="lore-roman">Nocturne of Glass Currents</div>

  <!-- CENTER: ent -->
  <section class="panel-center">
    <div class="center-title">Nocturne of Glass Currents</div>

  <!-- RIGHT: clinical console -->
  <section class="panel-right">

    <div class="ecg-block">
      <div class="console-header"><span>monitoring</span><span>realtime</span></div>

      <div class="console-header"><span>memory</span><span>0x????</span></div>

    <div class="msg-block">
      <div class="console-header"><span>system</span><span>kernel.log</span></div>
      <div class="msg-wrap" id="msg-wrap"></div>

  </section>
</div>

<!-- ============================================================
     PRESENTATION OVERLAY · only on first awakening
     The wake-veil is the black covering that lifts gradually
     so elements emerge from darkness. The presentation div
     holds the title and author, in fade in / hold / fade out.
     ============================================================ -->
<div id="wake-veil"></div>
<div id="presentation">
  <div id="presentation-title">Nocturne of Glass Currents</div>
  <div id="presentation-author">Ernesto Cisneros Cino</div>
</div>

<!-- ============================================================
     CLOSING · the farewell line after two complete cycles
     "The room is empty now. It always was."
     ============================================================ -->
<div id="closing-line"><p>The room is empty now. It always was.</p></div>
<div id="blackout"></div>

<audio id="audio" preload="auto"></audio>

<script>
'use strict';

/* ============================================================
   CONFIG · palettes, lore, system message pool
   ============================================================ */

const tracks = [
  {
    roman: 'I',
    title: 'Nocturne of Glass Currents',
    // dark green
    pal: {

      voidMid:  [15, 22, 18],

      accent:   [122, 184, 110],

    profile: {

    paragraphs: [

        "There is no ",
        { revise: ["moment when it begins", "exact moment when it begins"] },

        { revise: ["is a story", "is not a record"] },
        "; it is a room you visited once, and the door has been bricked. What remains are fragments that no longer arrange themselves into a face. You move them around like furniture in a house you cannot identify. None of it consoles. None of it was meant to."
      ],
      [
        "Outside, the world continues being a world. People sleep. Trains pass. Something vast and uninterested in your existence breathes through the wiring of every building, every screen, every nerve in your skin. You understand, for an instant, that this has always been true. That the silence underneath everything is not waiting for you, is not against you, simply does not know you are there. And then the understanding folds back into itself, because no human animal can hold it for long. You sit in the dark green of the hour. You wait without waiting. The night, having begun, does not require your consent."
      ]
    ],
    // Second revolution: same temperature, different voice. Here the
    // speaker is no longer the indeterminate "you" of Revolution I.
    // It is "I", reflecting from the deepest interior.
    paragraphsAlt: [
      [
        "I am writing this from a place I cannot describe, because I am not sure it is a place. I sit at the table, or what I have always called the table, and I notice that my hand looks ",
        { revise: ["like a hand", "like a stranger's hand"] },

        { revise: ["true", "useful"] },
        ". I am still here, technically. I am still drawing breath. But the thread between yesterday and today has been cut, or was never tied, and I have stopped trying to splice it. I write because the writing happens. I do not write to be read."
      ],
      [
        "There is a thought I have stopped pushing away. It is the thought that consciousness, mine or anyone's, is the universe accidentally noticing itself in a small mirror, and the mirror was never the point. The light passes through me. The light would pass through me if I were not here. I am the brief friction the light forgets the moment it leaves. And I find, to my astonishment, that I am not afraid of this. I am tired of pretending it was supposed to be otherwise. I sit in the dark green of the hour. I write. I disappear. Both, at the same time, because by now they are the same thing."
      ]

  },
  {
    roman: 'II',
    title: 'Glass Rituals for Phantom Hearts',

      bone:     [218, 220, 230],

      smokeDensityLo: 185, smokeDensityHi: 88,
      vigCenterColor: [20, 20, 48], vigCenterAlpha: 0.26, vigEdgeAlpha: 0.88,

    },
    paragraphs: [
      [
        "There is a particular grief reserved for the things you loved that were never alive. The moon, for example. The moon was ",
        { revise: ["beautiful", "never yours"] },
        ", and the moon never knew. All those nights at windows believing it watched back, all those poems written under it as though it cared, the moon kept doing what moons do: reflecting light it does not own, dragging tides it does not feel."

        "Tonight you understand. Not as a thought, which is easy. As a body, which is harder. You feel the weight of every gesture you ever made toward something that could not receive it. The lover who became indifferent. The country that became indifferent. The face you tried to hold in memory that has now finally given up its outline. They are all the moon. They were always the moon. The cruelty is not that they did not love you; the cruelty is that ",

/* ============================================================
   AUDIO ENGINE · 9-band analyser (ported from main site)
   ============================================================ */
const audio = {
  ctx: null, analyser: null, source: null,
  el: document.getElementById('audio'),
  data: null,
  bands: { sub:0, bass:0, lowMid:0, mid:0, hiMid:0, treble:0, air:0, k1khz:0, k5_8:0 },
  peaks: { sub:0, bass:0, lowMid:0, mid:0, hiMid:0, treble:0, air:0 },
  // Exponentially-smoothed versions, consumed by the centre ent.
  // Smoother than raw bands so visuals don't strobe on every frame.
  smoothed: { sub:0, bass:0, lowMid:0, mid:0, hiMid:0, treble:0, air:0, k1khz:0, k5_8:0, energy:0, peak:0 },
  energy: 0,
  peak: 0,            // max bin magnitude this frame, 0..1
  rmsOverflow: false,
  // 'normal' during playback, 'slow' between tracks: makes the smoothed
  // copies decay over several seconds instead of one, so the residual
  // visual energy bleeds away gently instead of dropping to silence
  // the instant the audio element pauses.
  decayMode: 'normal',

  ensure() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 1024;
      this.analyser.smoothingTimeConstant = 0.6;
      this.data = new Uint8Array(this.analyser.frequencyBinCount);
      this.source = this.ctx.createMediaElementSource(this.el);
      this.source.connect(this.analyser);
      this.analyser.connect(this.ctx.destination);
    } catch (err) {
      // Audio graph failed (e.g. createMediaElementSource throws because
      // the element was already bound, or autoplay policy blocks ctx).
      // Reset cleanly so update() outputs strict zeros and audio.el can
      // still play through default routing.
      console.warn('audio.ensure failed, staying silent:', err);
      this.ctx = null;
      this.analyser = null;
      this.source = null;
      this.data = null;
    }
  },

  update(dt) {
    if (this.analyser) {
      this.analyser.getByteFrequencyData(this.data);
      const N = this.data.length;
      const slice = (lo, hi) => {
        let s = 0; const n = hi - lo;
        for (let i = lo; i < hi && i < N; i++) s += this.data[i];
        return (s / n) / 255;
      };
      this.bands.sub    = slice(0, 4);
      this.bands.bass   = slice(4, 12);
      this.bands.lowMid = slice(12, 32);
      this.bands.mid    = slice(32, 80);
      this.bands.hiMid  = slice(80, 160);
      this.bands.treble = slice(160, 320);
      this.bands.air    = slice(320, N);

      // gaussian-weighted energy around 1 kHz
      const sr = this.ctx.sampleRate;
      const binHz = sr / this.analyser.fftSize;
      const F0 = 1000, SIG = 250;
      let kSum = 0, kNorm = 0;
      for (let i = 0; i < N; i++) {
        const f = i * binHz, df = f - F0;
        const w = Math.exp(-(df*df) / (2*SIG*SIG));
        kSum += w * this.data[i]; kNorm += w * 255;
      }
      this.bands.k1khz = kNorm > 0 ? (kSum / kNorm) : 0;

      // flat 5-8 kHz
      const binLo = Math.max(0, Math.floor(5000 / binHz));
      const binHi = Math.min(N, Math.ceil(8000 / binHz));
      let s58 = 0, c58 = 0;
      for (let i = binLo; i < binHi; i++) { s58 += this.data[i]; c58++; }
      this.bands.k5_8 = c58 > 0 ? (s58 / c58) / 255 : 0;
    } else {
      // No analyser yet: hold bands at strict zero so the presentation
      // and any pre-audio moment stay genuinely silent. No procedural
      // sin waves, no fake life. The ent only stirs when real audio
      // arrives.
      this.bands.sub = 0; this.bands.bass = 0; this.bands.lowMid = 0;
      this.bands.mid = 0; this.bands.hiMid = 0; this.bands.treble = 0;
      this.bands.air = 0; this.bands.k1khz = 0; this.bands.k5_8 = 0;
    }

    this.energy = (this.bands.sub + this.bands.bass + this.bands.mid + this.bands.treble) * 0.25;

    if (this.data) {
      let p = 0;
      for (let i = 0; i < this.data.length; i++) {
        const v = this.data[i] / 255;
        if (v > p) p = v;
      }
      this.peak = p;
    } else {
      this.peak = 0;
    }

    // Peak hold with decay rate that follows decayMode: in slow mode the
    // peak indicator on the IRT meters drifts down over several seconds
    // instead of one, matching the slower band decay during rest.
    const peakDecay = (this.decayMode === 'slow' ? 0.12 : 0.6) * dt;
    for (const k of ['sub','bass','lowMid','mid','hiMid','treble','air']) {
      const v = this.bands[k];
      this.peaks[k] = Math.max(this.peaks[k] - peakDecay, v);
    }

    // Exponentially-smoothed copies for the centre ent, ECG and IRT.
    // 'normal' mode: bands lerp at k=0.18 (reacts to music in ~1 s),
    // 'slow'   mode: bands lerp at k=0.02 (decays over ~4-6 s),
    // so when the track ends and raw bands snap to zero, the smoothed
    // copies bleed down gently rather than collapsing in one frame.
    const slow = this.decayMode === 'slow';
    const bandK   = slow ? 0.02 : 0.18;
    const energyK = slow ? 0.012 : 0.08;
    const peakK   = slow ? 0.018 : 0.15;
    for (const key of ['sub','bass','lowMid','mid','hiMid','treble','air','k1khz','k5_8']) {
      this.smoothed[key] = this.smoothed[key] * (1 - bandK) + this.bands[key] * bandK;
    }
    this.smoothed.energy = this.smoothed.energy * (1 - energyK) + this.energy * energyK;
    this.smoothed.peak   = this.smoothed.peak   * (1 - peakK)   + this.peak   * peakK;

    // RMS overflow flag (crosses 0.55)
    this.rmsOverflow = this.energy > 0.55;
  }
};

  revolution: 1,
  trackFiles: [null, null, null, null],
  trackUrls: [null, null, null, null],

  counters: { stripes: 0, phantoms: 0, faults: 0, overflow: 0 },
  _lastOverflow: false,
  _stripeCooldown: 0

/* ============================================================
   PHASE MANAGER · session-wide state machine
   Phases:
     idle          before user clicks Begin
     presentation  ~38 s wake-up coreography (only at session start)
     playing       a track is active
     resting       inter-track pause (~24 s, audio paused)
     closing       8 h reached, farewell coreography
     closed        blackout, no further activity

   The presentation runs once per session. Closing fires automatically
   after CLOSING_HOURS of looping. Set CLOSING_HOURS to null to disable.
   ============================================================ */
const phases = {
  /* Tunable timing.
     Wake-up order is strict dramaturgy: the name of the work over
     absolute black (nothing behind it), then the author, then both
     leave; only then the veil lifts and the central entity emerges
     alone; the console cascades after it; the left panel receives
     its first text when the music begins. */
  PRESENTATION_MS:    38000,    // total wake-up duration
  TITLE_FADE_IN_AT:    2000,    // work title emerges over pure black
  AUTHOR_FADE_IN_AT:   7000,    // author follows
  TITLE_FADE_OUT_AT:  15000,    // title + author leave together
  VEIL_LIFT_AT:       19000,    // veil lifts: centre entity emerges alone
  CASCADE_AT:         26000,    // right-panel console cascades after
  INFLUENCE_RAMP_START: 19000,  // ent presence ramp-up window start
  INFLUENCE_RAMP_END:   30000,  // ent presence ramp-up window end
  REST_MS:            24000,    // inter-track pause duration
  /* Web edition: the piece runs exactly two complete cycles.
     One cycle = both voices heard once = two revolutions of the
     four themes. Two cycles = four revolutions = each theme sounds
     four times, each text is seen twice. Then the planned ending.
     The 8-hour version exists only in the exhibition build. */
  REVOLUTIONS_TOTAL:      4,
  CLOSING_HOURS:       null,    // time-based closing disabled on the web
  CLOSING_AUDIO_FADE_MS: 8000,
  CLOSING_FADE_MS:      20000,  // stillness between last note and farewell
  FAREWELL_HOLD_MS:     10000,  // farewell holds, then blinks
  FAREWELL_BLINK_MS:     1100,
  BLACKOUT_FADE_MS:      6000,
  BLACKOUT_HOLD_MS:     10000,  // black, then home. the room does not keep you.

  phase: 'idle',
  sessionStartTime: null,
  phaseStartTime: null,
  isResting: false,

  // Smoothed rest influence driven by phases.update each frame.
  // The ent reads its setRestInfluence from this, so transitions
  // into and out of rest never jump. Asymmetric: slow into rest
  // (5 s) so silence settles gracefully, quicker out of rest
  // (1.5 s) so the new track feels responsive.
  restInfluenceCurrent: 0,
  _lastRestT: null,

  begin() {
    this.sessionStartTime = performance.now();
    this._enter('presentation');
    this._scheduledPresentation();
  },

  _enter(p) {
    this.phase = p;
    this.phaseStartTime = performance.now();
  },

  /* ---- PRESENTATION ----------------------------------------
     A single one-time coreography. Title and author fade in
     early, the wake-veil lifts gradually so atmosphere emerges,
     the right-panel cascades block by block, title fades out,
     and finally the first track begins.
     -------------------------------------------------------- */
  _scheduledPresentation() {
    const veil  = document.getElementById('wake-veil');
    const pres  = document.getElementById('presentation');
    const right = document.querySelector('.panel-right');

    setTimeout(() => pres.classList.add('show-title'),  this.TITLE_FADE_IN_AT);
    setTimeout(() => pres.classList.add('show-author'), this.AUTHOR_FADE_IN_AT);
    setTimeout(() => pres.classList.add('fading'),      this.TITLE_FADE_OUT_AT);
    setTimeout(() => veil.classList.add('lifted'),      this.VEIL_LIFT_AT);
    setTimeout(() => right.classList.add('cascade'),    this.CASCADE_AT);
    setTimeout(() => sysmsg.emit('cold boot. consciousness module mounted.'),
                                                        this.CASCADE_AT + 5600);
    setTimeout(() => this._startTrack(0),               this.PRESENTATION_MS);
  },

  _startTrack(idx) {
    this.isResting = false;
    audio.decayMode = 'normal';
    document.querySelector('.panel-left').classList.add('live');
    this._enter('playing');
    // Restore audio volume in case closing fade was started
    audio.el.volume = 1;
    switchTrack(idx, true);
  },

  /* ---- RESTING ---------------------------------------------
     Between tracks. Pause audio so all reactive elements fall
     to baseline. Left panel goes empty. Centre ent enters rest
     mode (curves straighten, halos disappear). System and
     Memory keep ticking at reduced tempo: the machine never
     stops measuring, but during rest it measures stillness.
     -------------------------------------------------------- */
  _startRest() {
    this.isResting = true;
    audio.decayMode = 'slow';
    typewriter.reset();
    document.querySelector('.panel-left').classList.remove('live');
    audio.el.pause();
    state.fadingOut = false;
    this._enter('resting');
  },

  onTrackEnded() {
    if (this.phase === 'closing' || this.phase === 'closed') return;
    // Two complete cycles reached: the last theme of the last
    // revolution has ended. Go to the planned ending.
    if (state.currentTrack === 3 && state.revolution >= this.REVOLUTIONS_TOTAL) {
      this._startClosing();
      return;
    }
    this._startRest();
  },

  /* ---- CLOSING ---------------------------------------------
     Triggered when the last theme of the last revolution ends
     (two complete cycles). Sequence:
       0 s   : ent enters rest, stillness settles
       20 s  : farewell line "The room is empty now. It always was."
               fades in (4 s) and holds
       30 s  : the line blinks once, like a signal failing
       31 s  : full blackout fades in (6 s)
       47 s  : the visitor is returned home. The room does not
               keep anyone.
     -------------------------------------------------------- */
  _startClosing() {
    if (this.phase === 'closing' || this.phase === 'closed') return;
    sysmsg.emit('shutdown signal received. memory still warm.');
    this._enter('closing');
    this.isResting = true;
    audio.decayMode = 'slow';
    typewriter.reset();
    document.querySelector('.panel-left').classList.remove('live');
    this._fadeAudio(audio.el.volume, 0, this.CLOSING_AUDIO_FADE_MS);
    setTimeout(() => audio.el.pause(), this.CLOSING_AUDIO_FADE_MS + 500);
    const line = document.getElementById('closing-line');
    const tFarewell = this.CLOSING_FADE_MS;
    const tBlink    = tFarewell + this.FAREWELL_HOLD_MS;
    const tBlack    = tBlink + this.FAREWELL_BLINK_MS;
    const tHome     = tBlack + this.BLACKOUT_FADE_MS + this.BLACKOUT_HOLD_MS;
    setTimeout(() => line.classList.add('visible'), tFarewell);
    setTimeout(() => line.classList.add('blink'),   tBlink);
    setTimeout(() => {
      line.classList.remove('visible', 'blink');
      document.getElementById('blackout').classList.add('visible');
    }, tBlack);
    setTimeout(() => {
      this._enter('closed');
      window.location.replace('/');
    }, tHome);
  },

  _fadeAudio(from, to, durMs) {
    const start = performance.now();
    const tick = () => {
      const e = performance.now() - start;
      const t = Math.min(1, e / durMs);
      audio.el.volume = Math.max(0, from + (to - from) * t);
      if (t < 1) requestAnimationFrame(tick);
    };
    tick();
  },

  /* ---- per-frame update, called from the main loop --------- */
  update(t) {
    // Time-based closing trigger (disabled on the web edition:
    // CLOSING_HOURS is null; the ending is revolution-driven)
    if (this.CLOSING_HOURS != null &&
        this.sessionStartTime != null &&
        this.phase !== 'closing' && this.phase !== 'closed' &&
        (t - this.sessionStartTime) > this.CLOSING_HOURS * 3600 * 1000) {
      this._startClosing();
    }

    // Ent presentation influence: 0..1 during the wake-up window
    if (this.phase === 'presentation') {
      const e = t - this.phaseStartTime;
      let inf;
      if (e < this.INFLUENCE_RAMP_START) inf = 0;
      else if (e < this.INFLUENCE_RAMP_END) {
        const p = (e - this.INFLUENCE_RAMP_START) /
                  (this.INFLUENCE_RAMP_END - this.INFLUENCE_RAMP_START);
        inf = p * p * (3 - 2 * p);   // smoothstep
      } else inf = 1;
      ent.setPresentationInfluence(inf);
    } else if (this.phase === 'idle') {
      ent.setPresentationInfluence(0);
    } else {
      ent.setPresentationInfluence(1);
    }

    // Smoothly drive ent rest influence with asymmetric time constants.
    // Going INTO rest is slow (tau ~5 s) so silence settles gracefully;
    // coming OUT of rest is quicker (tau ~1.5 s) so the next track feels
    // alive. This is what makes the ent reach its quiet state lentamente,
    // sin saltos, and any residual audio energy bleed away pleasantly.
    if (this._lastRestT == null) this._lastRestT = t;
    const dtRest = Math.max(0, t - this._lastRestT);
    this._lastRestT = t;
    const target = this.isResting ? 1 : 0;
    const rampingIn = target > this.restInfluenceCurrent;
    const tau = rampingIn ? 5000 : 1500;
    const alpha = 1 - Math.exp(-dtRest / tau);
    this.restInfluenceCurrent =
      this.restInfluenceCurrent * (1 - alpha) + target * alpha;
    ent.setRestInfluence(this.restInfluenceCurrent);

    // Resting: advance to next track after REST_MS elapses
    if (this.phase === 'resting') {
      const e = t - this.phaseStartTime;
      if (e > this.REST_MS) {
        const next = (state.currentTrack + 1) % 4;
        this._startTrack(next);
      }
    }
  }
};

/* ============================================================
   PALETTE · apply a track's colors to CSS variables
   ============================================================ */
function applyPalette(p) {
  const r = document.documentElement.style;
  r.setProperty('--void',         `rgb(${p.void.join(',')})`);
  r.setProperty('--void-mid',     `rgb(${p.voidMid.join(',')})`);
  r.setProperty('--bone',         `rgb(${p.bone.join(',')})`);
  r.setProperty('--bone-dim',     `rgba(${p.bone.join(',')},0.55)`);
  r.setProperty('--bone-faint',   `rgba(${p.bone.join(',')},0.18)`);
  r.setProperty('--accent',       `rgb(${p.accent.join(',')})`);
  r.setProperty('--accent-dim',   `rgba(${p.accent.join(',')},0.55)`);
  r.setProperty('--accent-glow',  `rgba(${p.accent.join(',')},0.22)`);
  // Two extra-faint variants so the right panel can pick up a whisper
  // of the current track's hue without breaking its phosphor-green
  // identity. Used by a soft gradient and a thin bottom edge inside
  // the console. The chromatic bridge from the centre across to the
  // machine: present, but never loud.
  r.setProperty('--accent-soft',  `rgba(${p.accent.join(',')},0.045)`);
  r.setProperty('--accent-bleed', `rgba(${p.accent.join(',')},0.18)`);
  // Right panel console colors stay locked to canonical phosphor green
  // across all tracks. The machine measures the same regardless of which
  // emotional weather is passing through the human. Only --accent leaks
  // across, picked up by a single detail: the ASCII-decoded reveal in the
  // memory dump. That is the one chromatic bridge from human to machine.
  document.body.style.background = `rgb(${p.void.join(',')})`;
}

/* ============================================================
   TYPEWRITER · the lore writes itself in real time
   The total schedule scales to complete at 3/4 of the track's
   duration. Two revisions per panel: draft text appears, the
   writer hesitates, deletes it, writes the better phrasing.
   ============================================================ */
const typewriter = (() => {
  const roman = document.getElementById('lore-roman');
  const body  = document.getElementById('lore-body');

  // Intrinsic timing (before scaling to track duration)
  const CHAR_BASE      = 85;     // per-character typing
  const CHAR_VAR       = 50;     // ± variation
  const CHAR_DELETE    = 45;     // per-character backspace
  const COMMA_PAUSE    = 240;
  const CLAUSE_PAUSE   = 280;    // em-dash, semicolon, colon
  const SENT_PAUSE     = 720;    // . ? !
  const PARA_PAUSE     = 2000;
  const REV_THINK      = 1500;   // pause after typing draft, before deleting
  const REV_AFTER      = 380;    // pause after deleting, before final
  // Minimum scale to avoid unreadably fast typing on short tracks
  const MIN_SCALE      = 0.4;

  let schedule = null;
  let cursor   = 0;
  let state    = null;
  let active   = false;
  let done     = false;

  function escapeChar(ch) {
    if (ch === '&') return '&amp;';
    if (ch === '<') return '&lt;';
    if (ch === '>') return '&gt;';
    return ch;
  }

  function compile(paragraphs, duration) {
    const raw = [];

    function pushText(text, em, paraIdx) {
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const delay = CHAR_BASE + (Math.random() - 0.5) * CHAR_VAR;
        raw.push({ type: 'char', ch, em, paraIdx, delay });
        if (ch === ',') raw.push({ type: 'pause', delay: COMMA_PAUSE });
        else if (ch === ';' || ch === ':') raw.push({ type: 'pause', delay: CLAUSE_PAUSE });
        else if (ch === '.' || ch === '!' || ch === '?') raw.push({ type: 'pause', delay: SENT_PAUSE });
      }
    }

    paragraphs.forEach((para, pidx) => {
      if (pidx > 0) raw.push({ type: 'newpara', paraIdx: pidx, delay: PARA_PAUSE });

      para.forEach(seg => {
        if (typeof seg === 'string') {
          pushText(seg, false, pidx);
        } else if (seg.em) {
          pushText(seg.em, true, pidx);
        } else if (seg.revise) {
          const [draft, final] = seg.revise;
          pushText(draft, false, pidx);
          raw.push({ type: 'pause', delay: REV_THINK });
          for (let i = 0; i < draft.length; i++) {
            raw.push({ type: 'backspace', paraIdx: pidx, delay: CHAR_DELETE });
          }
          raw.push({ type: 'pause', delay: REV_AFTER });
          pushText(final, !!seg.emFinal, pidx);
        }
      });
    });

    // Compute total raw time, scale to target (3/4 of duration)
    const rawTotal = raw.reduce((s, e) => s + e.delay, 0);
    const target = duration * 0.75 * 1000;
    let scale = target / rawTotal;
    if (scale < MIN_SCALE) scale = MIN_SCALE;

    // Cadence: after the title appears, hold for a beat before the first
    // character is typed. The track always opens slowly, so writing must
    // not crash in on the first downbeat. Proportional to track length,
    // clamped to a perceptual range of 3 to 5 seconds.
    const titleHoldMs = Math.max(3000, Math.min(5000, duration * 1000 / 60));

    let t = titleHoldMs;
    raw.forEach(e => {
      e.delay = e.delay * scale;
      t += e.delay;
      e.time = t;
    });

    return raw;
  }

  function init(paragraphs, duration) {
    cursor = 0;
    done = false;
    state = {
      // per-paragraph: array of {ch, em, decay?, phantom?}
      paras: paragraphs.map(() => []),
      currentPara: 0,
      numParas: paragraphs.length,
      // For each paragraph: audio time (seconds) when its last char
      // was written, then null afterwards. Used to schedule the
      // delayed word-decay effect.
      paraCompletedAt: paragraphs.map(() => null),
      // Whether each paragraph has already had its decay applied
      paraDecayed: paragraphs.map(() => false),
      // Whether each paragraph has already had its phantom contagion
      paraPhantomed: paragraphs.map(() => false),
      // Number of consecutive frames the 5-8 kHz band has been above
      // the contagion threshold. Used to require a sustained peak
      // rather than firing on a single noisy frame.
      _peakK5Frames: 0
    };
    schedule = compile(paragraphs, duration);
    body.classList.remove('fading');
    // pre-render empty paragraphs so layout is stable
    render();
    requestAnimationFrame(() => body.classList.add('live'));
    active = true;
  }

  function reset() {
    schedule = null; cursor = 0; state = null;
    active = false; done = false;
    body.classList.remove('live', 'fading');
    body.innerHTML = '';
    // Reset the smooth-scroll so the next track starts at the top.
    body.scrollTop = 0;
  }

  /* ---- word-range helpers ---------------------------------------
     Treat the emitted char array as a string and find word ranges.
     A "word" is a run of letters/digits (we keep apostrophes inside
     for "don't", "doesn't"). Each returned range carries the chars'
     start and end indices so we can mark them later.
     -------------------------------------------------------------- */
  function findWordRanges(chars) {
    const ranges = [];
    let i = 0;
    while (i < chars.length) {
      if (/[A-Za-z0-9']/.test(chars[i].ch)) {
        let j = i;
        while (j < chars.length && /[A-Za-z0-9']/.test(chars[j].ch)) j++;
        const word = chars.slice(i, j).map(c => c.ch).join('');
        ranges.push({ start: i, end: j, word });
        i = j;
      } else {
        i++;
      }
    }
    return ranges;
  }

  // Function words: never selected for decay or phantom. The point of
  // both effects is to break meaning, and function words carry too
  // little of it for their removal to land.
  const STOPWORDS = new Set([
    'the','that','this','with','from','your','you','was','were','have',
    'been','what','when','where','then','them','they','here','there',
    'only','once','ever','never','just','more','into','like','will',
    'would','could','should','about','which','their','these','those',
    'because','still','than','also','until','while','some','such',
    'each','very','most','many','same','other','being','having',
    'doing','through','before','after','above','below','again',
    'further','during','against','within','without','around','among'
  ]);

  function pickDecayWord(chars) {
    const ranges = findWordRanges(chars);
    // Candidates: not in stoplist, >= 5 chars, all lowercase letters
    // (avoid catching numerals or already-decayed runs).
    const candidates = ranges.filter(r =>
      r.word.length >= 5 &&
      !STOPWORDS.has(r.word.toLowerCase()) &&
      /^[A-Za-z']+$/.test(r.word)
    );
    if (candidates.length === 0) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function pickPhantomWord(chars) {
    // Same criteria as decay, but we also require the paragraph to
    // have enough material that picking the last-written word doesn't
    // feel like the contagion was scheduled rather than triggered.
    const ranges = findWordRanges(chars);
    const candidates = ranges.filter(r =>
      r.word.length >= 5 &&
      !STOPWORDS.has(r.word.toLowerCase()) &&
      /^[A-Za-z']+$/.test(r.word)
    );
    if (candidates.length === 0) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function applyDecayIfDue(audioTime) {
    let dirty = false;
    // Only previous (already-completed) paragraphs are candidates.
    // The current paragraph is still being written and would feel
    // wrong to start eroding while the cursor is on it.
    for (let i = 0; i < state.paras.length; i++) {
      if (state.paraDecayed[i]) continue;
      const completedAt = state.paraCompletedAt[i];
      if (completedAt == null) continue;
      // Wait 3 seconds after the paragraph closed before eroding it.
      // Long enough for the reader to register the period; short
      // enough that the disappearance feels causal, not arbitrary.
      if (audioTime - completedAt < 3.0) continue;
      const target = pickDecayWord(state.paras[i]);
      if (!target) { state.paraDecayed[i] = true; continue; }
      for (let k = target.start; k < target.end; k++) {
        state.paras[i][k].decay = true;
      }
      state.paraDecayed[i] = true;
      state.paraDecayAppliedAt = state.paraDecayAppliedAt || {};
      state.paraDecayAppliedAt[i] = audioTime;
      dirty = true;
    }
    return dirty;
  }

  // After the vibrate+fade animation has played, freeze the decayed
  // chars into a settled state. Same logic as settlePhantomsIfDue:
  // any re-render after this point uses the static .tw-decayed-settled
  // class (visibility hidden) rather than restarting the animation.
  function settleDecaysIfDue(audioTime) {
    if (!state.paraDecayAppliedAt) return false;
    let dirty = false;
    for (const k of Object.keys(state.paraDecayAppliedAt)) {
      const pIdx = +k;
      const appliedAt = state.paraDecayAppliedAt[k];
      if (appliedAt == null) continue;
      if (audioTime - appliedAt < 4.3) continue;
      const chars = state.paras[pIdx];
      let local = false;
      for (let i = 0; i < chars.length; i++) {
        if (chars[i].decay && !chars[i].decaySettled) {
          chars[i].decaySettled = true;
          local = true;
        }
      }
      if (local) dirty = true;
      state.paraDecayAppliedAt[k] = null;
    }
    return dirty;
  }

  function applyPhantomIfDue() {
    // Contagion fires once per paragraph when the 5-8 kHz band peaks.
    // We use the smoothed value because the raw band can spike on a
    // single noisy frame, and the smoothed copy is already what the
    // centre's stripe layer reacts to: this way the contagion is
    // visually synchronised with what the spectator sees in the ent.
    const k5 = (window.audio && audio.smoothed) ? audio.smoothed.k5_8 : 0;
    if (k5 > 0.55) state._peakK5Frames++; else state._peakK5Frames = 0;
    if (state._peakK5Frames < 6) return false;   // ~0.1 s sustained

    const cp = state.currentPara;
    if (state.paraPhantomed[cp]) return false;
    const chars = state.paras[cp];
    if (chars.length < 12) return false;          // wait for some material

    // Don't phantom the word currently being typed (last word, possibly
    // incomplete). Walk back to find a closed word.
    const ranges = findWordRanges(chars).filter(r =>
      r.word.length >= 5 &&
      !STOPWORDS.has(r.word.toLowerCase()) &&
      /^[A-Za-z']+$/.test(r.word) &&
      r.end < chars.length - 1
    );
    if (ranges.length === 0) return false;
    const picked = ranges[Math.floor(Math.random() * ranges.length)];
    for (let k = picked.start; k < picked.end; k++) chars[k].phantom = true;
    state.paraPhantomed[cp] = true;
    state.paraPhantomAppliedAt = state.paraPhantomAppliedAt || {};
    state.paraPhantomAppliedAt[cp] = (window.audio ? audio.el.currentTime : 0);
    state._peakK5Frames = 0;
    return true;
  }

  // After the glitch animation has played for ~0.6 s, freeze the
  // phantom chars into a settled state that uses a non-animated class.
  // Because render() rewrites innerHTML whenever the typewriter adds a
  // char, an unsettled phantom span would restart its animation every
  // time. Settling it locks the final ghostly appearance in place.
  function settlePhantomsIfDue(audioTime) {
    if (!state.paraPhantomAppliedAt) return false;
    let dirty = false;
    for (const k of Object.keys(state.paraPhantomAppliedAt)) {
      const pIdx = +k;
      const appliedAt = state.paraPhantomAppliedAt[k];
      if (appliedAt == null) continue;
      if (audioTime - appliedAt < 0.65) continue;
      const chars = state.paras[pIdx];
      let local = false;
      for (let i = 0; i < chars.length; i++) {
        if (chars[i].phantom && !chars[i].phantomSettled) {
          chars[i].phantomSettled = true;
          local = true;
        }
      }
      if (local) dirty = true;
      state.paraPhantomAppliedAt[k] = null;
    }
    return dirty;
  }

  function tick(audioTime) {
    if (!active || !schedule) return;
    const tMs = audioTime * 1000;
    let dirty = false;
    const prevPara = state.currentPara;

    while (cursor < schedule.length && schedule[cursor].time <= tMs) {
      const ev = schedule[cursor];
      cursor++;
      if (ev.type === 'char') {
        state.paras[state.currentPara].push({ ch: ev.ch, em: ev.em });
        dirty = true;
      } else if (ev.type === 'backspace') {
        const p = state.paras[state.currentPara];
        if (p.length > 0) { p.pop(); dirty = true; }
      } else if (ev.type === 'newpara') {
        // Moving on: the paragraph we just left is now closed and
        // becomes a candidate for delayed decay.
        if (state.paraCompletedAt[state.currentPara] == null) {
          state.paraCompletedAt[state.currentPara] = audioTime;
        }
        state.currentPara = ev.paraIdx;
        dirty = true;
      }
    }

    if (cursor >= schedule.length && !done) {
      done = true;
      // The final paragraph closes when the schedule ends.
      if (state.paraCompletedAt[state.currentPara] == null) {
        state.paraCompletedAt[state.currentPara] = audioTime;
      }
      dirty = true;
    }

    // Per-frame: erode completed paragraphs after their grace period.
    if (applyDecayIfDue(audioTime)) dirty = true;
    // Per-frame: try contagion on the current paragraph when 5-8 kHz
    // sustains a peak.
    if (applyPhantomIfDue()) dirty = true;
    // Per-frame: freeze decays past their animation window so subsequent
    // re-renders don't restart the vibrate+fade sequence.
    if (settleDecaysIfDue(audioTime)) dirty = true;
    // Per-frame: freeze phantoms past their glitch window so subsequent
    // re-renders don't restart the animation.
    if (settlePhantomsIfDue(audioTime)) dirty = true;

    if (dirty) render();
  }

  /* ---- smooth scroll keeping the cursor at ~55% from the top ----
     Called every frame from the main loop. The lore-body has a
     fixed height (filling the panel-left below the title) and
     overflow:hidden. As text accumulates past the visible area,
     scrollTop is eased toward a target that keeps the active
     writing position roughly in the centre of the panel.
     -------------------------------------------------------------- */
  function scrollTick() {
    if (!active) return;
    const cur = body.querySelector('.tw-cursor');
    if (!cur) return;
    const bodyH = body.clientHeight;
    if (bodyH < 10) return;
    const target = Math.max(0, cur.offsetTop - bodyH * 0.55);
    const current = body.scrollTop;
    const delta = target - current;
    if (Math.abs(delta) < 0.5) {
      body.scrollTop = target;
    } else {
      body.scrollTop = current + delta * 0.08;
    }
  }

  /* ----------------------------------------------------------------
     Per-char rendering with three optional markings (phantom, decay,
     em) and a stateful span grouper that opens and closes the right
     wrapping when the effective class changes between consecutive
     chars. Priority is phantom > decay > em > none: a phantomed word
     overrides any underlying italic, a decayed word likewise. This
     keeps the HTML minimal: at most one open wrapper at a time, and
     contiguous chars with the same effective class collapse into a
     single span instead of one span per character.
     ---------------------------------------------------------------- */
  function effectiveClass(c) {
    if (c.phantom && c.phantomSettled) return 'phantomSettled';
    if (c.phantom)                     return 'phantom';
    if (c.decay   && c.decaySettled)   return 'decaySettled';
    if (c.decay)                       return 'decay';
    if (c.em)                          return 'em';
    return 'none';
  }
  function openTag(cls) {
    if (cls === 'phantom')         return '<span class="tw-phantom">';
    if (cls === 'phantomSettled')  return '<span class="tw-phantom-settled">';
    if (cls === 'decay')           return '<span class="tw-decayed">';
    if (cls === 'decaySettled')    return '<span class="tw-decayed-settled">';
    if (cls === 'em')              return '<em>';
    return '';
  }
  function closeTag(cls) {
    if (cls === 'phantom' || cls === 'phantomSettled' ||
        cls === 'decay'   || cls === 'decaySettled') return '</span>';
    if (cls === 'em')                                return '</em>';
    return '';
  }

  function renderParaChars(chars, showCursor) {
    let out = '';
    let cur = 'none';
    for (let i = 0; i < chars.length; i++) {
      const c = chars[i];
      const cls = effectiveClass(c);
      if (cls !== cur) {
        out += closeTag(cur);
        out += openTag(cls);
        cur = cls;
      }
      out += escapeChar(c.ch);
    }
    out += closeTag(cur);
    if (showCursor) out += '<span class="tw-cursor">▍</span>';
    return out;
  }

  function render() {
    if (!state) return;
    const cp = state.currentPara;
    const html = state.paras.map((chars, i) => {
      const isCurrent = (i === cp && !done);
      return `<p>${renderParaChars(chars, isCurrent)}</p>`;
    }).join('');
    body.innerHTML = html;
  }

  function fadeOut() {
    body.classList.add('fading');
    body.classList.remove('live');
  }

  return { init, reset, tick, fadeOut, scrollTick };
})();

/* ============================================================
   ENT · centre audio-reactive engine (real, ported from
   the production site). Internally: value noise, fbm smoke,
   28-vertex deformed sphere, 5-8 kHz stripes, ghostly word
   layer, broken-camera filter, palette interpolation.
   The "rest" mode dims everything to a quiet baseline so
   inter-track pauses feel like a held breath.
   ============================================================ */
const ent = (() => {
  const canvas = document.getElementById('ent');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = 0, H = 0, DPR = 1;

  // External presentation influence (0 full intro state, 1 full active)
  // The presentation manager nudges this from 0 to 1 over the wake-up
  // coreography. The rest manager nudges it back partially during pauses.
  let presentationInfluence = 0;       // 0 = invisible/dormant, 1 = full
  let restInfluence = 0;               // 0 = playing, 1 = full rest

  // The atmosphere profile structure used by the original engine
  function defaultProfile() {
    return {
      voidColor: [5, 10, 8],
      smokeTintLo: [12, 32, 24], smokeBaseLo: [25, 60, 45],
      smokeTintHi: [20, 50, 38], smokeBaseHi: [42, 82, 62],
      smokeDensityLo: 175, smokeDensityHi: 82,
      vigCenterColor: [14, 36, 26], vigCenterAlpha: 0.22, vigEdgeAlpha: 0.86,
      stripe1: [130, 200, 150], stripe2: [190, 215, 195], stripe3: [100, 170, 130]
    };
  }
  function cloneProfile(p) {
    return {
      voidColor: [...p.voidColor],
      smokeTintLo: [...p.smokeTintLo], smokeBaseLo: [...p.smokeBaseLo],
      smokeTintHi: [...p.smokeTintHi], smokeBaseHi: [...p.smokeBaseHi],
      smokeDensityLo: p.smokeDensityLo, smokeDensityHi: p.smokeDensityHi,
      vigCenterColor: [...p.vigCenterColor],
      vigCenterAlpha: p.vigCenterAlpha, vigEdgeAlpha: p.vigEdgeAlpha,
      stripe1: [...p.stripe1], stripe2: [...p.stripe2], stripe3: [...p.stripe3]
    };
  }

  const PALETTE = {
    bone:        [184, 179, 160],
    boneLit:     [212, 205, 184],
    bronzeLit:   [90, 95, 62]
  };
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  /* ---- value noise 2D / 3D (no deps) ----------------------- */
  const noise = (() => {
    const perm = new Uint8Array(512);
    const tmp = new Uint8Array(256);
    for (let i = 0; i < 256; i++) tmp[i] = i;
    let seed = 1729;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [tmp[i], tmp[j]] = [tmp[j], tmp[i]];
    }
    for (let i = 0; i < 512; i++) perm[i] = tmp[i & 255];
    const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const grad = (h, x, y, z) => {
      const u = h < 8 ? x : y;
      const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
      return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
    };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
      const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
      return lerp(
        lerp(
          lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
          lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u),
          v),
        lerp(
          lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
          lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u),
          v),
        w);
    }
    function fbm(x, y, z, oct = 4, lac = 2.0, gain = 0.5) {
      let f = 1, a = 1, sum = 0, norm = 0;
      for (let i = 0; i < oct; i++) {
        sum += a * n3(x * f, y * f, z * f);
        norm += a;
        f *= lac;
        a *= gain;
      }
      return sum / norm;
    }
    return { n3, fbm };
  })();

  /* ---- track atmosphere with smoothstep interpolation ----- */
  const trackAtmosphere = {
    FADE_MS: 7000,
    REBAKE_INTERVAL: 1400,
    startTime: 0,
    lastRebake: 0,
    progress: 1,
    // Initialized inline so ent.draw is safe to call even before
    // ent.init() runs. Without this, the main loop crashed on its
    // very first frame attempting to read atm.voidColor on null.
    from:    defaultProfile(),
    to:      defaultProfile(),
    current: defaultProfile(),
    init() {
      const p = defaultProfile();
      this.from = cloneProfile(p);
      this.to = cloneProfile(p);
      this.current = cloneProfile(p);
      this.progress = 1;
    },
    transition(profile) {
      const p = profile || defaultProfile();
      this.from = cloneProfile(this.current);
      this.to = cloneProfile(p);
      this.startTime = performance.now();
      this.lastRebake = this.startTime;
      this.progress = 0;
    },
    update(t) {
      if (this.progress >= 1) return;
      const elapsed = t - this.startTime;
      const p = Math.min(1, elapsed / this.FADE_MS);
      this.progress = p * p * (3 - 2 * p);
      const tt = this.progress;
      const k3 = ['voidColor','smokeTintLo','smokeBaseLo','smokeTintHi','smokeBaseHi',
                  'vigCenterColor','stripe1','stripe2','stripe3'];
      for (const k of k3) {
        for (let i = 0; i < 3; i++) {
          this.current[k][i] = this.from[k][i] + (this.to[k][i] - this.from[k][i]) * tt;
        }
      }
      const k1 = ['smokeDensityLo','smokeDensityHi','vigCenterAlpha','vigEdgeAlpha'];
      for (const k of k1) {
        this.current[k] = this.from[k] + (this.to[k] - this.from[k]) * tt;
      }
      if (this.progress >= 1) smoke._startIncrementalBake(this.current);
      else if (t - this.lastRebake > this.REBAKE_INTERVAL) {
        this.lastRebake = t;
        smoke._startIncrementalBake(this.current);
      }
    }
  };

  /* ---- smoke: two offscreen canvases, baked incrementally - */
  const smoke = {
    lo: null, hi: null, loCtx: null, hiCtx: null,
    sw: 0, sh: 0, offsetLo: 0, offsetHi: 0,
    _pendingBakes: [], ROWS_PER_CHUNK: 12,
    regen() {
      this._ensureCanvases();
      this._bakeFull('lo', 0.006, 4, 1, trackAtmosphere.current);
      this._bakeFull('hi', 0.018, 3, 1.8, trackAtmosphere.current);
    },
    _ensureCanvases() {
      this.sw = Math.max(2, Math.ceil(W / 2));
      this.sh = Math.max(2, Math.ceil(H / 2));
      if (!this.lo) this.lo = document.createElement('canvas');
      if (!this.hi) this.hi = document.createElement('canvas');
      this.lo.width = this.sw; this.lo.height = this.sh;
      this.hi.width = this.sw; this.hi.height = this.sh;
      this.loCtx = this.lo.getContext('2d');
      this.hiCtx = this.hi.getContext('2d');
    },
    _bakeFull(which, scale, oct, warp, prof) {
      const c = which === 'lo' ? this.loCtx : this.hiCtx;
      const w = this.sw, h = this.sh;
      const img = c.createImageData(w, h);
      const d = img.data;
      const tint = which === 'lo' ? prof.smokeTintLo : prof.smokeTintHi;
      const baseTint = which === 'lo' ? prof.smokeBaseLo : prof.smokeBaseHi;
      const densityMax = which === 'lo' ? prof.smokeDensityLo : prof.smokeDensityHi;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const wx = noise.fbm(x * scale + 100, y * scale, 0, 2) * warp;
          const wy = noise.fbm(x * scale, y * scale + 100, 0, 2) * warp;
          let v = noise.fbm((x + wx * 30) * scale, (y + wy * 30) * scale, 0, oct);
          v = (v + 0.5);
          if (which === 'lo') {
            const grad = 1 - (y / h);
            v *= 0.55 + 0.45 * grad;
          } else { v *= 0.4; }
          v = Math.max(0, Math.min(1, v));
          const i = (y * w + x) * 4;
          d[i]     = tint[0] + (baseTint[0] - tint[0]) * v;
          d[i + 1] = tint[1] + (baseTint[1] - tint[1]) * v;
          d[i + 2] = tint[2] + (baseTint[2] - tint[2]) * v;
          d[i + 3] = densityMax * v;
        }
      }
      c.putImageData(img, 0, 0);
    },
    _cloneProf(p) {
      return {
        smokeTintLo: [...p.smokeTintLo], smokeBaseLo: [...p.smokeBaseLo],
        smokeTintHi: [...p.smokeTintHi], smokeBaseHi: [...p.smokeBaseHi],
        smokeDensityLo: p.smokeDensityLo, smokeDensityHi: p.smokeDensityHi
      };
    },
    _startIncrementalBake(prof) {
      this._pendingBakes = [
        { which: 'lo', scale: 0.006, oct: 4, warp: 1,    prof: this._cloneProf(prof), row: 0, img: null },
        { which: 'hi', scale: 0.018, oct: 3, warp: 1.8,  prof: this._cloneProf(prof), row: 0, img: null }
      ];
    },
    pumpBake() {
      if (this._pendingBakes.length === 0) return;
      const job = this._pendingBakes[0];
      const c = job.which === 'lo' ? this.loCtx : this.hiCtx;
      const w = this.sw, h = this.sh;
      if (!job.img) job.img = c.createImageData(w, h);
      const d = job.img.data;
      const tint = job.which === 'lo' ? job.prof.smokeTintLo : job.prof.smokeTintHi;
      const baseTint = job.which === 'lo' ? job.prof.smokeBaseLo : job.prof.smokeBaseHi;
      const densityMax = job.which === 'lo' ? job.prof.smokeDensityLo : job.prof.smokeDensityHi;
      const endRow = Math.min(job.row + this.ROWS_PER_CHUNK, h);
      for (let y = job.row; y < endRow; y++) {
        for (let x = 0; x < w; x++) {
          const wx = noise.fbm(x * job.scale + 100, y * job.scale, 0, 2) * job.warp;
          const wy = noise.fbm(x * job.scale, y * job.scale + 100, 0, 2) * job.warp;
          let v = noise.fbm((x + wx * 30) * job.scale, (y + wy * 30) * job.scale, 0, job.oct);
          v = (v + 0.5);
          if (job.which === 'lo') {
            const grad = 1 - (y / h);
            v *= 0.55 + 0.45 * grad;
          } else { v *= 0.4; }
          v = Math.max(0, Math.min(1, v));
          const i = (y * w + x) * 4;
          d[i]     = tint[0] + (baseTint[0] - tint[0]) * v;
          d[i + 1] = tint[1] + (baseTint[1] - tint[1]) * v;
          d[i + 2] = tint[2] + (baseTint[2] - tint[2]) * v;
          d[i + 3] = densityMax * v;
        }
      }
      job.row = endRow;
      if (job.row >= h) {
        c.putImageData(job.img, 0, 0);
        this._pendingBakes.shift();
      }
    },
    draw() {
      if (!this.lo) return;
      this.offsetLo += 0.15 + audio.smoothed.sub * 0.4;
      this.offsetHi += 0.05 + audio.smoothed.air * 0.6;
      const yLo = (this.offsetLo % this.sh);
      const yHi = (this.offsetHi % this.sh);
      ctx.globalAlpha = 0.85;
      ctx.drawImage(this.lo, 0, yLo - this.sh, W, H);
      ctx.drawImage(this.lo, 0, yLo, W, H);
      ctx.globalAlpha = 0.55;
      ctx.drawImage(this.hi, 0, yHi - this.sh, W, H);
      ctx.drawImage(this.hi, 0, yHi, W, H);
      ctx.globalAlpha = 1;
    }
  };

  /* ---- entity: 28-vertex Fibonacci sphere with fbm distort  */
  const entity = {
    N: 28,
    base: [], pos: [], proj: [],
    rot: { x: 0, y: 0, z: 0 },
    init() {
      this.base = []; this.pos = []; this.proj = [];
      const phi = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < this.N; i++) {
        const y = 1 - (i / (this.N - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const theta = phi * i;
        this.base.push([Math.cos(theta) * r, y, Math.sin(theta) * r]);
        this.pos.push([0, 0, 0]);
        this.proj.push([0, 0, 0, 0]);
      }
    },
    update(t) {
      this.rot.x = t * 0.00009;
      this.rot.y = t * 0.00013 * 1.317;
      this.rot.z = t * 0.00007 * 0.831;
      const cx = Math.cos(this.rot.x), sx = Math.sin(this.rot.x);
      const cy = Math.cos(this.rot.y), sy = Math.sin(this.rot.y);
      const cz = Math.cos(this.rot.z), sz = Math.sin(this.rot.z);
      const tt = t * 0.0004;
      const breath = 1 + audio.smoothed.bass * 0.35 + Math.sin(t * 0.0008) * 0.04;
      // During intro, shrink to ~55%; presentationInfluence 0..1 (1 = full)
      const introScale = 0.55 + 0.45 * presentationInfluence;
      const baseRadius = Math.min(W, H) * 0.32 * breath * introScale;
      // During rest, suppress audio-driven distortion
      const restK = 1 - restInfluence;
      const distort = 0.35 + audio.smoothed.energy * 0.7 * restK;
      for (let i = 0; i < this.N; i++) {
        const b = this.base[i];
        const nx = noise.fbm(b[0] * 1.7 + tt, b[1] * 1.7, b[2] * 1.7, 3) * distort;
        const ny = noise.fbm(b[0] * 1.7, b[1] * 1.7 + tt, b[2] * 1.7, 3) * distort;
        const nz = noise.fbm(b[0] * 1.7, b[1] * 1.7, b[2] * 1.7 + tt, 3) * distort;
        let x = b[0] + nx, y = b[1] + ny, z = b[2] + nz;
        let x1 =  cy * x + sy * z;
        let z1 = -sy * x + cy * z;
        let y1 =  cx * y - sx * z1;
        let z2 =  sx * y + cx * z1;
        let x2 =  cz * x1 - sz * y1;
        let y2 =  sz * x1 + cz * y1;
        this.pos[i][0] = x2 * baseRadius;
        this.pos[i][1] = y2 * baseRadius;
        this.pos[i][2] = z2 * baseRadius;
        const fov = Math.min(W, H) * 0.9;
        const camZ = baseRadius * 3;
        const denom = (camZ - this.pos[i][2]);
        const sx2 = (this.pos[i][0] * fov / denom) + W / 2;
        const sy2 = (this.pos[i][1] * fov / denom) + H / 2;
        this.proj[i][0] = sx2;
        this.proj[i][1] = sy2;
        this.proj[i][2] = this.pos[i][2];
        this.proj[i][3] = denom;
      }
    },
    draw(t) {
      const baseR = Math.min(W, H) * 0.32;
      const restK = 1 - restInfluence;
      const intensity = (audio.smoothed.energy + audio.smoothed.bass * 0.5) * restK;
      // Connection threshold: more generous than the original so the
      // web reads even without audio. Audio still widens it dramatically.
      const threshold = baseR * (1.25 + intensity * 0.65);
      const phase = noise.fbm(t * 0.0001, 0, 0, 2) * 0.3;
      const CURVE_MAX = 0.35;
