      const AGGRESSIVE_FRAC = 0.34;
      const AGGRESSIVE_MULT = 2.5;
      const K = audio.smoothed.k1khz * restK;
      // Combined dimming: presentation fade in + rest fade out
      const introDim = 0.4 + 0.6 * presentationInfluence;
      const restDim = 1 - restInfluence * 0.55;
      const dim = introDim * restDim;
      const isAggressive = (i, j) => {
        const h = (((i + 1) * 73856093) ^ ((j + 1) * 19349663)) >>> 0;
        return (h % 1000) / 1000 < AGGRESSIVE_FRAC;
      };
      ctx.lineCap = 'round';
      for (let i = 0; i < this.N; i++) {
        for (let j = i + 1; j < this.N; j++) {
          const dx = this.pos[i][0] - this.pos[j][0];
          const dy = this.pos[i][1] - this.pos[j][1];
          const dz = this.pos[i][2] - this.pos[j][2];
          const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
          const mod = 1 + phase * Math.sin((i + 1) * (j + 1) * 0.7);
          const eff = d * mod;
          if (eff < threshold) {
            const a = (1 - eff / threshold) * 0.55;
            const z = (this.pos[i][2] + this.pos[j][2]) * 0.5;
            const depthFade = 0.5 + 0.5 * (z / baseR);
            const finalA = Math.max(0.06, a * depthFade) * dim;
            const useBone = depthFade > 0.65 || audio.smoothed.treble > 0.5;
            const c = useBone ? PALETTE.bone : PALETTE.bronzeLit;
            ctx.strokeStyle = rgb(c, finalA);
            // Thicker base line so the web reads at TV viewing distance.
            ctx.lineWidth = 1.2 + audio.smoothed.treble * 1.8 * restK;
            const x1 = this.proj[i][0], y1 = this.proj[i][1];
            const x2 = this.proj[j][0], y2 = this.proj[j][1];
            const sx = x2 - x1, sy = y2 - y1;
            const segLen = Math.sqrt(sx*sx + sy*sy) || 1;
            const nx = -sy / segLen;
            const ny =  sx / segLen;
            let bow;
            if (isAggressive(i, j)) {
              const fastSign = Math.sin((i + 1) * (j + 1) * 1.371 + t * 0.0025);
              const wobble = noise.n3(i * 0.4 + t * 0.0015, j * 0.4, 0);
              bow = K * segLen * CURVE_MAX * AGGRESSIVE_MULT * fastSign * (1 + Math.abs(wobble) * 0.6);
            } else {
              const slowSign = Math.sin((i + 1) * (j + 1) * 1.371 + t * 0.0002);
              bow = K * segLen * CURVE_MAX * slowSign;
            }
            const cxp = (x1 + x2) * 0.5 + nx * bow;
            const cyp = (y1 + y2) * 0.5 + ny * bow;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.quadraticCurveTo(cxp, cyp, x2, y2);
            ctx.stroke();
          }
        }
      }
      // Vertices · scaled for TV viewing distance. Base radius bumped
      // from the original 0.9 so nodes read even at audio silence;
      // audio still doubles or triples them.
      const eAvg = audio.smoothed.energy * restK;
      const eBass = audio.smoothed.bass * restK;
      const ePeak = audio.smoothed.peak * restK;
      for (let i = 0; i < this.N; i++) {
        const z = this.pos[i][2];
        const depthFade = 0.4 + 0.6 * ((z + baseR) / (baseR * 2));
        const r = (3 + ePeak * 2.0 + eBass * 1.2 + eAvg * 0.6) * depthFade;
        // Lowered halo threshold so the bass pulse reads instantly.
        const glow = eBass * 0.7 + ePeak * 0.35;
        if (glow > 0.04) {
          const px = this.proj[i][0], py = this.proj[i][1];
          const haloR = r * (2.8 + glow * 4.2);
          const c = PALETTE.boneLit;
          const peakA = Math.min(1, glow * 0.55) * depthFade * dim;
          const grad = ctx.createRadialGradient(px, py, 0, px, py, haloR);
          grad.addColorStop(0,    `rgba(${c[0]},${c[1]},${c[2]},${peakA})`);
          grad.addColorStop(0.30, `rgba(${c[0]},${c[1]},${c[2]},${peakA * 0.55})`);
          grad.addColorStop(0.70, `rgba(${c[0]},${c[1]},${c[2]},${peakA * 0.12})`);
          grad.addColorStop(1,    `rgba(${c[0]},${c[1]},${c[2]},0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(px, py, haloR, 0, Math.PI * 2);
          ctx.fill();
        }
        // Brighter core baseline so nodes are visible even at silence.
        const coreA = Math.min(1, 0.80 + eBass * 0.4 + eAvg * 0.25) * depthFade * dim;
        ctx.fillStyle = rgb(PALETTE.boneLit, coreA);
        ctx.beginPath();
        ctx.arc(this.proj[i][0], this.proj[i][1], r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  };

  /* ---- stripes: 5-8 kHz reactive vertical flashes --------- */
  const stripes = {
    active: [], MAX: 5, SPAWN_GAIN: 0.35,
    update(t) {
      if (presentationInfluence < 0.9 || restInfluence > 0.05 ||
          !audio.ctx || audio.el.paused) {
        if (this.active.length) this.active = [];
        return;
      }
      const k = audio.bands.k5_8;
      const maxActive = Math.floor(k * this.MAX);
      const spawnProb = k * this.SPAWN_GAIN;
      if (this.active.length < maxActive && Math.random() < spawnProb) {
        this.active.push(this.spawn(t, k));
        state.counters.stripes++;
        pulseCounter('ctr-stripes');
      }
      this.active = this.active.filter(s => t < s.endAt);
    },
    spawn(t, intensity) {
      const x = Math.random() * W;
      const width = 1 + Math.random() * 2;
      const fullHeight = Math.random() < 0.4;
      const heightFrac = fullHeight ? 1 : (0.25 + Math.random() * 0.6);
      const y = fullHeight ? 0 : Math.random() * (H * (1 - heightFrac));
      const dur = 60 + Math.random() * 120;
      const roll = Math.random();
      const atm = trackAtmosphere.current;
      const color = roll < 0.55 ? atm.stripe1 : roll < 0.85 ? atm.stripe2 : atm.stripe3;
      return { x, width, y, h: H * heightFrac, startAt: t, endAt: t + dur, intensity, seed: Math.random() * 1000, color };
    },
    draw(t) {
      if (this.active.length === 0) return;
      ctx.save();
      for (const s of this.active) {
        const age = (t - s.startAt) / (s.endAt - s.startAt);
        const env = age < 0.15 ? (age / 0.15) : (1 - (age - 0.15) / 0.85);
        if (env <= 0) continue;
        const alpha = env * 0.85;
        const haloW = 10 + s.intensity * 18;
        const grad = ctx.createLinearGradient(s.x - haloW, 0, s.x + haloW, 0);
        const ch = s.color;
        grad.addColorStop(0,   `rgba(${ch[0]},${ch[1]},${ch[2]},0)`);
        grad.addColorStop(0.5, `rgba(${ch[0]},${ch[1]},${ch[2]},${alpha * 0.22})`);
        grad.addColorStop(1,   `rgba(${ch[0]},${ch[1]},${ch[2]},0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(s.x - haloW, s.y, haloW * 2, s.h);
        const segH = 4;
        const segs = Math.ceil(s.h / segH);
        const ageT = t * 0.008;
        for (let i = 0; i < segs; i++) {
          const sy = s.y + i * segH;
          const jitter = noise.n3(s.seed + i * 0.18, ageT, 0) * 4 * (0.6 + s.intensity * 0.5);
          const segA = alpha * (0.65 + 0.35 * noise.n3(s.seed + 33, i * 0.4 + ageT * 1.5, 0));
          ctx.fillStyle = `rgba(${ch[0]},${ch[1]},${ch[2]},${segA})`;
          ctx.fillRect(s.x + jitter, sy, s.width, segH);
        }
      }
      ctx.restore();
    }
  };

  /* ---- phantoms: drifting word layer ---------------------- */
  const phantoms = {
    WORDS: [
      'FRACTURE','HOLLOW','DISSOLVE','ABSENT','TRACE','WHISPER','SHATTERED','DREAMS','MEMORY','BLEED',
      'ECHO','PHANTOM','HEART','RITUAL','ME','DRIFT','SOUL','WET','CONCRETE','ORBIT',
      'ABANDONED','BRIDE','MOON','VEINS','MERCURY','GLASS','CURRENTS','NOCTURNE','MALFORMED','MALFUNCTION',
      'ATLAS','BLOOD','VIRTUAL','GOLD','DUST','PIANO','AGONY','DESCENT','TREMOR','ANXIETY',
      'LUCID','SUFFOCATE','DECAY','WITHDRAWN','THIRST','ALONE','FORGOTTEN','DISAPPEAR','UNREAL','SHUDDER',
      'UNNAMABLE','DEFORMED','ENDLESS','VOICE','SPECTRE','NEON','RAIN','INSIDE','NEVER','WAITING',
      'ISOLATION','DESIRE','WOUND','EMPTY','SILENCE','NIGHT','FEAR','ABSENCE','PAIN','SHADOW',
      'TRAIN','STORM','SKIN','PULSE','ASH','BONE','PRESENCE','IMMENSE','INDIFFERENT','NOTHING',
      'NOBODY','LOST','MIRROR','BREATHE','BROKEN','INCOMPLETE','DARK','COLD','SMOKE','STILL',
      'NULL','VOID','0xFF','0x00','SEGFAULT','ORPHAN','HOME','DANGLING','FAULT','PANIC',
      'ABORT!','SIGSEGV','KERNEL','FATAL','HALT','GOTO','REM','DIM','POKE','PEEK',
      '0xDEAD','0xBEEF','0xBADF00D','/dev/null','EXIT 139','PIPE BROKEN','RECURSION','UNCAUGHT','KILL -9','CORE DUMPED'
    ],
    BUG_GLYPHS: ['▓','░','▒','│','┤','└','┴','▀','■','▪','▌','▐'],
    COLOR_GREEN: [120, 195, 110],
    COLOR_YELLOW: [210, 200, 130],
    START_DELAY: 20, CODA_GUARD: 20,
    MAX_ACTIVE: 10, MIN_LIFE_S: 1.0, MAX_LIFE_S: 7.0,
    SPAWN_PROB: 0.08, MAX_PLACE_ATTEMPTS: 8,
    YELLOW_PROB: 0.20, APPROACH_PROB: 0.35, BUG_PROB: 0.15,
    PEAK_ALPHA: 0.55,
    active: [], _lastAudioTime: 0,
    reset() { this.active = []; this._lastAudioTime = 0; },
    pickFontSize() {
      const r = Math.random();
      // 55% small (5-8px), 38% medium (9-11px), 4% large legible (12-14px),
      // 3% intruder (60-100px). The intruder tier is deliberately rare:
      // it should surprise, not become an expected event. Its size is
      // not its own attraction; its scarcity is. The large phantoms also
      // never reach full opacity (see large-phantom draw branch below).
      if (r < 0.55) return 5 + Math.floor(Math.random() * 4);
      if (r < 0.93) return 9 + Math.floor(Math.random() * 3);
      if (r < 0.97) return 12 + Math.floor(Math.random() * 3);
      return 60 + Math.floor(Math.random() * 41);
    },
    corruptWord(w) {
      const n = 1 + Math.floor(Math.random() * 2);
      const chars = w.split('');
      for (let i = 0; i < n; i++) {
        const idx = Math.floor(Math.random() * chars.length);
        chars[idx] = this.BUG_GLYPHS[Math.floor(Math.random() * this.BUG_GLYPHS.length)];
      }
      return chars.join('');
    },
    overlaps(x, y, w, h) {
      for (const p of this.active) {
        const sc = Math.max(p.startScale, p.endScale);
        const pw = p.w * sc, ph = p.h * sc;
        const px = p.x - (pw - p.w) * 0.5;
        const py = p.y - (ph - p.h) * 0.5;
        if (x < px + pw && x + w > px && y < py + ph && y + h > py) return true;
      }
      return false;
    },
    trySpawn(ct) {
      const word = this.WORDS[Math.floor(Math.random() * this.WORDS.length)];
      const fs = this.pickFontSize();
      const isLarge = fs >= 60;
      const family = "'JetBrains Mono', 'Courier New', monospace";
      ctx.save();
      ctx.font = `${fs}px ${family}`;
      const tw = ctx.measureText(word).width;
      ctx.restore();
      const th = fs * 1.3;
      const pad = isLarge ? 24 : 8;
      let x = 0, y = 0, placed = false;
      for (let i = 0; i < this.MAX_PLACE_ATTEMPTS; i++) {
        x = pad + Math.random() * Math.max(1, W - tw - pad * 2);
        y = pad + Math.random() * Math.max(1, H - th - pad * 2);
        if (!this.overlaps(x, y, tw + pad, th + pad)) { placed = true; break; }
      }
      if (!placed) return;

      let color, lifeS, bug, approach, startScale, endScale;
      if (isLarge) {
        // Large intruders: always approach, pronounced zoom, slow, no
        // glitches, no yellow tint. They drift in like something almost
        // arriving and almost departing, never fully present.
        color      = this.COLOR_GREEN;
        lifeS      = 7 + Math.random() * 5;        // 7 to 12 s
        bug        = null;
        approach   = true;
        startScale = 0.55;
        endScale   = 1.40;
      } else {
        color = Math.random() < this.YELLOW_PROB ? this.COLOR_YELLOW : this.COLOR_GREEN;
        lifeS = this.MIN_LIFE_S + Math.random() * (this.MAX_LIFE_S - this.MIN_LIFE_S);
        bug = null;
        if (Math.random() < this.BUG_PROB) {
          const r = Math.random();
          bug = r < 0.40 ? 'jitter' : r < 0.75 ? 'corrupt' : 'double';
        }
        approach   = Math.random() < this.APPROACH_PROB;
        startScale = approach ? 0.82 : 1.0;
        endScale   = approach ? 1.20 : 1.0;
      }

      this.active.push({
        word: bug === 'corrupt' ? this.corruptWord(word) : word,
        x, y, w: tw, h: th, fontSize: fs, family, color, isLarge,
        audioStart: ct, audioEnd: ct + lifeS,
        bug, approach, startScale, endScale
      });
      state.counters.phantoms++;
      pulseCounter('ctr-phantoms');
    },
    update(t) {
      if (!audio.ctx || audio.el.paused) return;
      if (restInfluence > 0.05) { this.active = []; return; }
      const ct = audio.el.currentTime;
      if (ct < this._lastAudioTime - 1) this.reset();
      this._lastAudioTime = ct;
      if (ct < this.START_DELAY) return;
      this.active = this.active.filter(p => p.audioEnd > ct);
      const dur = audio.el.duration;
      if (isFinite(dur) && dur > 0 && (dur - ct) <= this.CODA_GUARD) return;
      if (this.active.length < this.MAX_ACTIVE && Math.random() < this.SPAWN_PROB) {
        this.trySpawn(ct);
      }
    },
    draw() {
      if (this.active.length === 0) return;
      if (!audio.ctx) return;
      const ct = audio.el.currentTime;
      ctx.save();
      ctx.textBaseline = 'alphabetic';
      for (const p of this.active) {
        const dur = p.audioEnd - p.audioStart;
        const prog = (ct - p.audioStart) / dur;
        if (prog < 0 || prog > 1) continue;
        let env, alpha;
        if (p.isLarge) {
          // Large intruders use a softer envelope (raised sine) so the
          // fade-in and fade-out feel more pronounced, plus a much
          // lower alpha cap (~0.22) so they never fully resolve. They
          // are present without being legible, ghosts of words that
          // almost arrived. They also stay translucent through their
          // peak instead of brightening.
          env = Math.pow(Math.sin(prog * Math.PI), 1.6);
          alpha = env * 0.22;
        } else {
          env = Math.sin(prog * Math.PI);
          alpha = env * this.PEAK_ALPHA;
        }
        const scale = p.startScale + (p.endScale - p.startScale) * prog;
        const cx = p.x + p.w * 0.5;
        const cy = p.y + p.h * 0.7;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.translate(-cx, -cy);
        let jx = 0, jy = 0;
        if (p.bug === 'jitter') {
          jx = (Math.random() - 0.5) * 3;
          jy = (Math.random() - 0.5) * 1.5;
        }
        ctx.font = `${p.fontSize}px ${p.family}`;
        const c = p.color;
        if (p.bug === 'double') {
          ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha * 0.45})`;
          ctx.fillText(p.word, p.x + 1.5 + jx, p.y + p.h * 0.8 + 1 + jy);
        }
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
        ctx.fillText(p.word, p.x + jx, p.y + p.h * 0.8 + jy);
        ctx.restore();
      }
      ctx.restore();
    }
  };

  /* ---- filter: broken-camera aberration + grain + freezes - */
  const filter = {
    snapshot: null, snapCtx: null,
    freezes: [], nextFreezeAt: 0,
    grainCanvas: null, grainCtx: null, grainPattern: null,
    init() {
      this.snapshot = document.createElement('canvas');
      this.snapCtx = this.snapshot.getContext('2d');
      this.grainCanvas = document.createElement('canvas');
      this.grainCtx = this.grainCanvas.getContext('2d');
      this.regrain();
    },
    regrain() {
      const s = 256;
      this.grainCanvas.width = s; this.grainCanvas.height = s;
      const img = this.grainCtx.createImageData(s, s);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255;
        d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 18;
      }
      this.grainCtx.putImageData(img, 0, 0);
    },
    applyAberration() {
      // Suppress during intro and rest
      if (presentationInfluence < 0.9 || restInfluence > 0.1) return;
      const ox = (noise.n3(performance.now() * 0.0003, 0, 0)) * 1.4;
      const oy = (noise.n3(0, performance.now() * 0.0003, 0)) * 1.0;
      const intensity = 0.10 + audio.smoothed.peak * 0.18;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = intensity;
      ctx.filter = 'brightness(0.6)';
      ctx.drawImage(canvas, ox * 1.3, oy * 0.7);
      ctx.drawImage(canvas, -ox * 0.8, -oy * 1.4);
      ctx.filter = 'none';
      ctx.restore();
    },
    applyGrain() {
      ctx.save();
      const restK = 1 - restInfluence * 0.6;
      const breath = (0.10 + audio.smoothed.energy * 0.15) * restK * presentationInfluence;
      ctx.globalAlpha = breath;
      ctx.globalCompositeOperation = 'overlay';
      if (!this.grainPattern) this.grainPattern = ctx.createPattern(this.grainCanvas, 'repeat');
      ctx.fillStyle = this.grainPattern;
      const ox = Math.floor(Math.random() * 256);
      const oy = Math.floor(Math.random() * 256);
      ctx.translate(-ox, -oy);
      ctx.fillRect(0, 0, W + 256, H + 256);
      ctx.restore();
      if (Math.random() < 0.05) {
        this.regrain();
        this.grainPattern = ctx.createPattern(this.grainCanvas, 'repeat');
      }
    },
    handleFreezes(t) {
      if (presentationInfluence < 0.9 || restInfluence > 0.1) {
        this.freezes = [];
        return;
      }
      if (t > this.nextFreezeAt) {
        this.spawnFreeze();
        const interval = 4000 + Math.random() * 8000 - audio.smoothed.energy * 1500;
        this.nextFreezeAt = t + Math.max(2500, interval);
      }
      if (this.snapshot.width !== W || this.snapshot.height !== H) {
        this.snapshot.width = W; this.snapshot.height = H;
      }
      this.snapCtx.drawImage(canvas, 0, 0, W, H);
      const now = t;
      this.freezes = this.freezes.filter(f => now < f.endAt);
      for (const f of this.freezes) {
        const age = (now - f.startAt) / (f.endAt - f.startAt);
        const a = age < 0.8 ? 1 : (1 - (age - 0.8) / 0.2);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.drawImage(f.cap, 0, 0, f.w, f.h, f.x, f.y, f.w, f.h);
        ctx.restore();
        // count this as a camera fault for the counter
        if (age < 0.05) {
          state.counters.faults++;
          pulseCounter('ctr-faults');
        }
      }
    },
    spawnFreeze() {
      const fw = 80 + Math.random() * 280;
      const fh = 50 + Math.random() * 200;
      const fx = Math.random() * Math.max(1, W - fw);
      const fy = Math.random() * Math.max(1, H - fh);
      const cap = document.createElement('canvas');
      cap.width = fw; cap.height = fh;
      cap.getContext('2d').drawImage(canvas, fx, fy, fw, fh, 0, 0, fw, fh);
      const dur = 80 + Math.random() * 180;
      this.freezes.push({
        x: fx, y: fy, w: fw, h: fh, cap,
        startAt: performance.now(), endAt: performance.now() + dur
      });
    },
    apply(t) {
      this.applyAberration();
      this.handleFreezes(t);
      this.applyGrain();
    }
  };

  /* ---- canvas plumbing ------------------------------------ */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    // Fallback if layout hasn't been computed yet (canvas inside a
    // freshly displayed grid cell can briefly report 0 in some browsers).
    if (W < 2 || H < 2) {
      const par = canvas.parentElement;
      W = (par && par.clientWidth)  || Math.floor(window.innerWidth  * 0.44);
      H = (par && par.clientHeight) || window.innerHeight;
    }
    canvas.width  = Math.max(2, W * DPR);
    canvas.height = Math.max(2, H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    smoke.regen();
  }

  function init() {
    trackAtmosphere.init();
    entity.init();
    filter.init();
    resize();
    // Re-run resize after layout settles. Two rAFs because the first
    // fires before the first paint, the second after the cell finished
    // its grid layout under whatever transitions were running.
    requestAnimationFrame(() => requestAnimationFrame(resize));
    // ResizeObserver: any time the canvas's own dimensions change
    // (window resize, devicePixelRatio change, parent grid reflow,
    // sidebar appearing in the browser, etc.) we re-derive W and H so
    // the ent stays perfectly centred and never drifts off the panel.
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => resize());
      ro.observe(canvas);
    }
  }

  function draw(_dt) {
    const t = performance.now();
    trackAtmosphere.update(t);
    smoke.pumpBake();
    const atm = trackAtmosphere.current;
    // background void
    ctx.fillStyle = rgb(atm.voidColor);
    ctx.fillRect(0, 0, W, H);
    // vignette
    const vign = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    const restK = 1 - restInfluence;
    vign.addColorStop(0, rgb(atm.vigCenterColor, atm.vigCenterAlpha + audio.smoothed.bass * 0.2 * restK));
    vign.addColorStop(0.6, rgb(atm.voidColor, 0.0));
    vign.addColorStop(1, rgb(atm.voidColor, atm.vigEdgeAlpha));
    ctx.fillStyle = vign;
    ctx.fillRect(0, 0, W, H);
    phantoms.update(t);
    phantoms.draw();
    smoke.draw();
    entity.update(t);
    entity.draw(t);
    stripes.update(t);
    stripes.draw(t);
    filter.apply(t);
  }

  return {
    init, resize, draw,
    onTrackChange(profile) {
      trackAtmosphere.transition(profile);
      phantoms.reset();
    },
    setPresentationInfluence(v) { presentationInfluence = Math.max(0, Math.min(1, v)); },
    setRestInfluence(v) { restInfluence = Math.max(0, Math.min(1, v)); }
  };
})();

function getVoid() {
  const v = getComputedStyle(document.documentElement).getPropertyValue('--void').trim();
  const m = v.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  return m ? [+m[1], +m[2], +m[3]] : [5, 10, 8];
}

/* ============================================================
   ECG MONITOR · 5 stacked traces, scrolling right→left
   ============================================================ */
const ecg = (() => {
  const canvas = document.getElementById('ecg');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const NUM_TRACES = 5;
  const LABELS = ['\u2211', 'STRIPE', 'PHANTOM', 'FAULT', 'OVERFLOW'];
  const COLS = 1024;
  const traces = LABELS.map(() => new Float32Array(COLS));
  let cursor = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function push(values) {
    for (let i = 0; i < NUM_TRACES; i++) traces[i][cursor] = values[i];
    cursor = (cursor + 1) % COLS;
  }

  function draw() {
    const accent = (() => {
      const v = getComputedStyle(document.documentElement).getPropertyValue('--console-green').trim();
      const m = v.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      return m ? [+m[1], +m[2], +m[3]] : [122, 195, 110];
    })();

    ctx.clearRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = `rgba(${accent[0]},${accent[1]},${accent[2]},0.06)`;
    ctx.lineWidth = 1;
    for (let i = 0; i <= NUM_TRACES; i++) {
      const y = i * (H / NUM_TRACES);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    const lane = H / NUM_TRACES;
    const padding = 3;

    for (let t = 0; t < NUM_TRACES; t++) {
      const tr = traces[t];
      const y0 = t * lane + lane - padding;
      const yMax = lane - padding * 2;
      ctx.strokeStyle = `rgba(${accent[0]},${accent[1]},${accent[2]},${t === 0 ? 0.9 : 0.65})`;
      ctx.lineWidth = t === 0 ? 1.2 : 0.8;
      ctx.beginPath();
      for (let i = 0; i < COLS; i++) {
        // read in correct order: oldest at cursor, newest at cursor-1
        const idx = (cursor + i) % COLS;
        const v = tr[idx];
        const x = (i / (COLS - 1)) * W;
        const y = y0 - v * yMax;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // label
      ctx.fillStyle = `rgba(${accent[0]},${accent[1]},${accent[2]},0.5)`;
      ctx.font = "9px 'JetBrains Mono', monospace";
      ctx.fillText(LABELS[t], 4, t * lane + 11);
    }
  }

  return { init: resize, resize, push, draw };
})();

/* ============================================================
   IRT METERS · 7 vertical bars with peak hold
   ============================================================ */
const irt = (() => {
  const wrap = document.getElementById('irt-wrap');
  const labels = ['40 Hz','100 Hz','300 Hz','1 kHz','3 kHz','8 kHz','16 kHz'];
  const keys   = ['sub','bass','lowMid','mid','hiMid','treble','air'];
  let bars = [];

  function init() {
    wrap.innerHTML = '';
    bars = labels.map((label, i) => {
      const el = document.createElement('div');
      el.className = 'irt-meter';
      el.innerHTML = `<div class="col"><div class="fill"></div><div class="peak"></div></div><div class="label">${label}</div>`;
      wrap.appendChild(el);
      return {
        fill: el.querySelector('.fill'),
        peak: el.querySelector('.peak'),
        key: keys[i]
      };
    });
  }

  function update() {
    for (const b of bars) {
      // Smoothed bands so the fill bleeds away over seconds instead
      // of dropping instantly when the audio element pauses. Peak hold
      // already decays softly via the decayMode-aware peakDecay.
      const v = Math.min(audio.smoothed[b.key], 1);
      const p = Math.min(audio.peaks[b.key], 1);
      b.fill.style.height = (v * 100) + '%';
      b.peak.style.bottom = (p * 100) + '%';
    }
  }

  return { init, update };
})();

/* ============================================================
   MEMORY DUMP · binary lines, some decode to lexicon words
   ============================================================ */
const memdump = (() => {
  const wrap = document.getElementById('mem-wrap');
  const LINES_VISIBLE = 14;
  let lines = [];
  let nextSpawnAt = 0;

  function randBits() {
    let s = '';
    for (let i = 0; i < 8; i++) s += Math.random() < 0.5 ? '0' : '1';
    return s;
  }
  function asciiBits(ch) {
    return ch.charCodeAt(0).toString(2).padStart(8, '0');
  }
  function makeAddr() {
    const n = Math.floor(Math.random() * 0xFFFF);
    return '0x' + n.toString(16).toUpperCase().padStart(4, '0');
  }
  function makeRandomLine() {
    const bits = [];
    for (let i = 0; i < 6; i++) bits.push(randBits());
    return { addr: makeAddr(), bits, hot: false, reveal: '' };
  }
  function makeHotLine() {
    const word = lexicon[Math.floor(Math.random() * lexicon.length)].padEnd(6, ' ').slice(0, 6);
    const bits = [];
    for (let i = 0; i < 6; i++) bits.push(asciiBits(word[i]));
    return { addr: makeAddr(), bits, hot: true, reveal: '→ "' + word.trim() + '"' };
  }
  function makeLine() {
    return Math.random() < 0.22 ? makeHotLine() : makeRandomLine();
  }

  function init() {
    lines = [];
    for (let i = 0; i < LINES_VISIBLE; i++) lines.push(makeLine());
    render();
  }
  function render() {
    wrap.innerHTML = lines.map(l =>
      `<div class="mem-line${l.hot ? ' hot' : ''}"><span class="addr">${l.addr}:</span><span class="bits">${l.bits.join(' ')}</span><span class="reveal">${l.reveal}</span></div>`
    ).join('');
  }
  function tick(t) {
    if (t < nextSpawnAt) return;
    // During rest, memory still flows but at slower cadence. The
    // machine measures stillness without alarming about it.
    const restMul = phases.isResting ? 3.6 : 1;
    nextSpawnAt = t + (0.18 + Math.random() * 0.3) * restMul;
    lines.unshift(makeLine());
    if (lines.length > LINES_VISIBLE) lines.pop();
    render();
  }

  return { init, tick };
})();

/* ============================================================
   SYSTEM MESSAGES · sober console log
   ============================================================ */
const sysmsg = (() => {
  const wrap = document.getElementById('msg-wrap');
  const LINES_VISIBLE = 10;
  let lines = [];
  let nextAt = 0;

  function ts() {
    const d = new Date();
    return '[' + d.toTimeString().slice(0,8) + ']';
  }
  function pickMessage() {
    return sysMessages[Math.floor(Math.random() * sysMessages.length)];
  }
  function init() {
    lines = []; render();
  }
  function render() {
    wrap.innerHTML = lines.map((l, i) =>
      `<div class="msg-line ${i > 3 ? 'fade' : ''}"><span class="ts">${l.ts}</span>${l.text}</div>`
    ).join('');
  }
  function emit(text, opts = {}) {
    lines.unshift({ ts: ts(), text });
    if (lines.length > LINES_VISIBLE) lines.pop();
    render();
  }
  function tick(t) {
    if (t < nextAt) return;
    const restMul = phases.isResting ? 3.6 : 1;
    nextAt = t + (1.4 + Math.random() * 2.6) * restMul;
    emit(pickMessage());
  }

  return { init, emit, tick };
})();

/* ============================================================
   COUNTERS · pulse on increment
   ============================================================ */
function pulseCounter(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 120);
}
function renderCounters() {
  document.querySelector('#ctr-stripes  .ctr-value').textContent = state.counters.stripes;
  document.querySelector('#ctr-phantoms .ctr-value').textContent = state.counters.phantoms;
  document.querySelector('#ctr-faults   .ctr-value').textContent = state.counters.faults;
  document.querySelector('#ctr-overflow .ctr-value').textContent = state.counters.overflow;
}
function resetCounters() {
  state.counters = { stripes: 0, phantoms: 0, faults: 0, overflow: 0 };
  renderCounters();
}

/* ============================================================
   TRACK SWITCHING
   ============================================================ */
function switchTrack(idx, autoPlay = true) {
  const url = state.trackUrls[idx];
  if (!url) return;
  // Revolution accounting: if we are entering track 0 and the previous
  // current track was track 3, we just completed a revolution. Bump
  // the counter so paragraphsAlt vs paragraphs alternates correctly.
  // The first call from phases.begin() lands here with currentTrack
  // already 0 (initial state), so we only bump when the transition
  // is genuinely a wrap from 3 back to 0.
  if (idx === 0 && state.currentTrack === 3) {
    state.revolution++;
    sysmsg.emit(`revolution ${state.revolution} begins. shifting voice.`);
  }
  state.currentTrack = idx;
  state.fadingOut = false;
  const t = tracks[idx];
  // Even revolutions (2, 4, 6...) use paragraphsAlt if present.
  // Odd revolutions (1, 3, 5...) use paragraphs. A track without an
  // alt falls back to paragraphs gracefully.
  const useAlt = (state.revolution % 2 === 0) && t.paragraphsAlt;
  const paragraphs = useAlt ? t.paragraphsAlt : t.paragraphs;

  // immediate visual reset
  typewriter.reset();
  // The lore element now carries the song title in the accent colour,
  // replacing the roman numeral. The .center-title element is the title
  // of the whole work and is never mutated by track changes.
  document.getElementById('lore-roman').textContent = t.title;
  applyPalette(t.pal);
  // notify centre ent of the new atmosphere profile (smoke, vignette,
  // stripe colours interpolate over 7 s)
  if (t.profile) ent.onTrackChange(t.profile);

  // load new audio
  audio.el.src = url;
  audio.el.load();

  const startWithDuration = () => {
    const dur = audio.el.duration;
    if (!dur || isNaN(dur) || dur === Infinity) {
      // fallback: assume 4 min
      typewriter.init(paragraphs, 240);
    } else {
      typewriter.init(paragraphs, dur);
    }
    if (autoPlay) {
      audio.ensure();
      if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
      audio.el.play().catch(()=>{});
      state.playing = true;
    }
  };

  if (audio.el.readyState >= 1 && !isNaN(audio.el.duration) && audio.el.duration > 0) {
    startWithDuration();
  } else {
    const onMeta = () => {
      audio.el.removeEventListener('loadedmetadata', onMeta);
      startWithDuration();
    };
    audio.el.addEventListener('loadedmetadata', onMeta);
  }

  resetCounters();
  sysmsg.emit(`load: track_${idx+1}.audio ok. entering "${t.title.toLowerCase()}"`);
}

/* ============================================================
   INTAKE · autoload the four album tracks by filename from the
   directory where this HTML lives. The work is shipped as a
   self-contained bundle: drop the HTML and the four mp3 files
   into the same folder and double-click Begin. No file pickers,
   no per-deployment configuration.
   ============================================================ */
// The four themes are served from the album's own audio directory.
// Nothing is duplicated: the triptych borrows the same files the
// album page plays, one level up in the site tree.
const AUDIO_FILES = [
  '/assets/audio/nocturne-of-glass-currents/01-Nocturne of Glass Currents.mp3',
  '/assets/audio/nocturne-of-glass-currents/07-Glass Rituals for Phantom Hearts.mp3',
  '/assets/audio/nocturne-of-glass-currents/09-The Blood of the Virtual World.mp3',
  '/assets/audio/nocturne-of-glass-currents/13-Broken Signal Run.mp3'
];

function setIntakeStatus() { /* web edition: no intake console */ }

// Verify each file is reachable via HEAD before flipping the Begin
// button to ready. We do not actually load the audio yet; we just
// build the URL. The audio element itself will fetch on play. If a
// file is missing, the slot is marked in error and Begin stays dim.
// Mark every slot as loaded immediately. The four audio filenames are
// known at build time and shipped inside the ZIP, so probing them at
// startup adds no information: if a file were missing, the audio
// element's error handler at play time is what catches it. This
// simpler version avoids HEAD/Range probes which are blocked in many
// sandbox contexts (Objkt iframe, some file:// hosts) and would leave
// the Begin button dim for no reason.
function autoloadTracks() {
  for (let i = 0; i < AUDIO_FILES.length; i++) {
    state.trackUrls[i] = encodeURI(AUDIO_FILES[i]);  // spaces -> %20, / survives
  }
}

autoloadTracks();

// The work is autonomous: a double-click opens it, and nothing else
// is ever offered to the visitor. From here the system runs by itself
// until its own planned ending (two complete cycles). No controls.
/* ============================================================
   ENTRY · the threshold
   The visitor arrived here through a door that only appears at
   the end of the album. One click on the darkness crosses the
   threshold (a user gesture is required by browser audio policy;
   we keep it diegetic). No fullscreen is forced: this room lives
   inside the site, windowed, like a memory does.

   MANDATORY BY DESIGN: once the work begins there is no pause,
   no stop, no exit control of any kind. The piece runs until its
   own planned ending and then returns the visitor home. This is
   not an omission. It is part of the work.
   ============================================================ */
function startWork() {
  const intake = document.getElementById('intake');
  intake.classList.remove('waiting');
  intake.classList.add('hidden');
  // Create and unlock the audio graph inside the gesture itself:
  // the strongest autoplay guarantee across browsers (Safari included).
  audio.ensure();
  if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
  setTimeout(() => {
    document.getElementById('stage').classList.add('live');
    // init everything
    ent.init();
    ecg.init();
    irt.init();
    memdump.init();
    sysmsg.init();
    renderCounters();
    // The phase manager drives the wake-up coreography and
    // schedules the start of track I at ~38 s.
    phases.begin();
    // Start the main render loop ONLY after every module is
    // initialized: earlier starts crash on the first frame.
    lastT = performance.now() / 1000;
    requestAnimationFrame(loop);
  }, 600);
}

(function armThreshold() {
  const intake = document.getElementById('intake');
  // The word appears after a breath of darkness.
  setTimeout(() => intake.classList.add('waiting'), 1800);
  intake.addEventListener('click', function once() {
    intake.removeEventListener('click', once);
    startWork();
  });
})();

/* ============================================================
/* When a track finishes, the phase manager enters the rest interval.
   It will auto-advance to the next track after REST_MS. The first
   four tracks are followed by another rest and the loop begins again
   without showing the presentation. */
audio.el.addEventListener('ended', () => {
  phases.onTrackEnded();
});

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastT = performance.now() / 1000;
function loop() {
  const now = performance.now() / 1000;
  const dt = Math.min(now - lastT, 0.05);
  lastT = now;

  // session-wide phase progression (presentation → playing →
  // resting → playing... → closing → closed). The phase manager
  // also drives ent.presentationInfluence and ent.restInfluence.
  phases.update(performance.now());

  audio.update(dt);

  // typewriter advance using audio.currentTime as the master clock
  if (audio.el && !isNaN(audio.el.currentTime)) {
    typewriter.tick(audio.el.currentTime);
  }
  // Smooth scroll the lore-body so the cursor stays roughly centred,
  // letting previous text glide up out of view as new text arrives.
  typewriter.scrollTick();

  // end-of-track fade: between 5 and 10 seconds before audio ends
  if (audio.el.duration && !state.fadingOut &&
      audio.el.currentTime > audio.el.duration - 8 &&
      audio.el.duration > 12 &&
      phases.phase === 'playing') {
    typewriter.fadeOut();
    state.fadingOut = true;
  }

  // RMS overflow edge detection (only counted during playing phase)
  if (phases.phase === 'playing') {
    if (audio.rmsOverflow && !state._lastOverflow) {
      state.counters.overflow++;
      pulseCounter('ctr-overflow');
    }
    state._lastOverflow = audio.rmsOverflow;
  } else {
    state._lastOverflow = false;
  }

  // ECG sampling: feed from audio.smoothed so the trace decays over
  // several seconds instead of snapping flat the instant audio.el
  // pauses at the end of a track. During presentation and rest the
  // smoothed values stay at 0 and traces sit on the baseline.
  ecg.push([
    audio.smoothed.energy,
    Math.min(audio.smoothed.k5_8 * 1.4, 1),
    Math.min(audio.smoothed.treble * 0.9, 1),
    Math.min(audio.smoothed.bass * 0.9, 1),
    audio.rmsOverflow ? 1 : audio.smoothed.energy * 0.6
  ]);

  // draw centre ent (handles its own presentation/rest dimming)
  ent.draw(dt);

  // ECG draw
  ecg.draw();

  // IRT meters
  irt.update();

  // memory dump and system messages tick on wall clock,
  // their tempo is adjusted internally based on phases.isResting
  memdump.tick(now);
  sysmsg.tick(now);

  renderCounters();

  requestAnimationFrame(loop);
}

/* ============================================================
   RESIZE handling
   ============================================================ */
window.addEventListener('resize', () => {
  ent.resize();
  ecg.resize();
});

// No keyboard shortcuts. The work runs autonomously after the opening
// The web edition begins with a single click on the threshold and
// runs, without controls, to its own planned ending: two complete
// cycles, the farewell line, black, and the quiet return home.
</script>
</body>
</html>
