    startTime: null,
    INTRO_MS: 5000,
    XFADE_MS: 1500,
    introInfluence: 1.0,   // 1 = full intro state, 0 = full main state
    init() {
      this.startTime = performance.now();
      // Schedule the visual handoff at the start of the crossfade

    update(t) {

  // ============================================================
  // TRACK ATMOSPHERE · interpolation engine
  // Smoothly transitions all atmosphere values over FADE_MS when
  // a new track loads. The render loop reads `current.*` which
  // is always a lerp between `from.*` and `to.*`.
  // ============================================================
  const trackAtmosphere = {
    FADE_MS: 7000,
    REBAKE_INTERVAL: 1400,
    startTime: 0,
    lastRebake: 0,
    progress: 1,
    from: null,
    to: null,
    current: null,

    init() {
      const p = TRACK_PROFILES[0];
      this.from = this._clone(p);
      this.to = this._clone(p);
      this.current = this._clone(p);
      this.progress = 1;
    },
    transition(idx) {
      const p = TRACK_PROFILES[idx] || TRACK_PROFILES[0];
      this.from = this._clone(this.current);
      this.to = this._clone(p);
      this.startTime = performance.now();
      this.lastRebake = this.startTime;
      this.progress = 0;
    },
    update(t) {
      if (this.progress >= 1) return;
      const elapsed = t - this.startTime;
      const p = Math.min(1, elapsed / this.FADE_MS);
      this.progress = p * p * (3 - 2 * p);
      this._lerpAll();
      if (this.progress >= 1) {
        smoke._startIncrementalBake(this.current);
      } else if (t - this.lastRebake > this.REBAKE_INTERVAL) {
        this.lastRebake = t;
        smoke._startIncrementalBake(this.current);
      }
    },
    _lerpAll() {
      const t = this.progress;
      const keys3 = ['voidColor','smokeTintLo','smokeBaseLo','smokeTintHi','smokeBaseHi',
                      'vigCenterColor','stripe1','stripe2','stripe3'];
      for (const k of keys3) {
        for (let i = 0; i < 3; i++) {
          this.current[k][i] = this.from[k][i] + (this.to[k][i] - this.from[k][i]) * t;
        }
      }
      const keys1 = ['smokeDensityLo','smokeDensityHi','vigCenterAlpha','vigEdgeAlpha'];
      for (const k of keys1) {
        this.current[k] = this.from[k] + (this.to[k] - this.from[k]) * t;
      }
    },
    _clone(p) {
      return {
        voidColor: [...p.voidColor],
        smokeTintLo: [...p.smokeTintLo], smokeBaseLo: [...p.smokeBaseLo],
        smokeTintHi: [...p.smokeTintHi], smokeBaseHi: [...p.smokeBaseHi],
        smokeDensityLo: p.smokeDensityLo, smokeDensityHi: p.smokeDensityHi,
        vigCenterColor: [...p.vigCenterColor],
        vigCenterAlpha: p.vigCenterAlpha, vigEdgeAlpha: p.vigEdgeAlpha,
        stripe1: [...p.stripe1], stripe2: [...p.stripe2], stripe3: [...p.stripe3]
      };
    }
  };

  // ============================================================
  // VALUE NOISE (2D and 3D) — small, deterministic, no deps
  // ============================================================
  const noise = (() => {
    const perm = new Uint8Array(512);
    const tmp = new Uint8Array(256);
    for (let i = 0; i < 256; i++) tmp[i] = i;
    let seed = 1729;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [tmp[i], tmp[j]] = [tmp[j], tmp[i]];
    }
    for (let i = 0; i < 512; i++) perm[i] = tmp[i & 255];
    const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const grad = (h, x, y, z) => {
      const u = h < 8 ? x : y;
      const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
      return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
    };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
      const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
      return lerp(
        lerp(
          lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
          lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u),
          v),
        lerp(
          lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
          lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u),
          v),
        w);
    }
    function fbm(x, y, z, oct = 4, lac = 2.0, gain = 0.5) {
      let f = 1, a = 1, sum = 0, norm = 0;
      for (let i = 0; i < oct; i++) {
        sum += a * n3(x * f, y * f, z * f);
        norm += a;
        f *= lac;
        a *= gain;
      }
      return sum / norm;
    }
    return { n3, fbm };
  })();

  // ============================================================
  // AUDIO SYSTEM
  // ============================================================
  const audio = {
    el: document.getElementById('audio'),
    ctx: null,
    analyser: null,
    source: null,
    data: null,
    bands: { sub: 0, bass: 0, lowMid: 0, mid: 0, hiMid: 0, treble: 0, air: 0, k1khz: 0, k5_8: 0 },
    smoothed: { sub: 0, bass: 0, lowMid: 0, mid: 0, hiMid: 0, treble: 0, air: 0, k1khz: 0, k5_8: 0, energy: 0, peak: 0 },
    energy: 0,
    peak: 0,
    ready: false,
    procedural: true,

    init() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return;
      }
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 1024;
      this.analyser.smoothingTimeConstant = 0.6;
      this.data = new Uint8Array(this.analyser.frequencyBinCount);
      this.source = this.ctx.createMediaElementSource(this.el);
      this.source.connect(this.analyser);
      this.analyser.connect(this.ctx.destination);
      this.ready = true;
    },
    loadUrl(url) {
      this.el.src = url;
      this.el.load();
      this.procedural = false;
      document.getElementById('play-btn').disabled = false;
    },
    sample() {
      if (this.procedural || !this.ready) {
        // Procedural mode: fabricate plausible audio for visual testing.
        const t = performance.now() * 0.001;
        const sub  = 0.5 + 0.5 * Math.sin(t * 0.31);
        const bass = 0.45 + 0.45 * Math.sin(t * 0.7 + 1.2) * Math.sin(t * 0.13);
        const mid  = 0.4 + 0.4 * Math.sin(t * 1.3 + 2.1);
        const treble = 0.25 + 0.25 * Math.abs(Math.sin(t * 2.7));
        this.bands.sub = sub * 0.55;
        this.bands.bass = bass * 0.5;
        this.bands.lowMid = (sub + bass) * 0.25;
        this.bands.mid = mid * 0.4;
        this.bands.hiMid = mid * 0.3;
        this.bands.treble = treble * 0.4;
        this.bands.air = treble * 0.25;
        // Procedural K1khz: oscillation independent of other bands
        this.bands.k1khz = 0.3 + 0.4 * Math.abs(Math.sin(t * 0.45 + 0.7)) * (0.6 + 0.4 * Math.sin(t * 0.11));
        // Procedural K5-8khz: sparse rhythmic transients (Math.pow biases toward zero
        // with occasional high spikes, simulating hi-hat / percussive transients)
        this.bands.k5_8 = Math.max(0, treble - 0.2) * 1.2 + 0.8 * Math.pow(Math.random(), 5);
        this.energy = (sub + bass + mid + treble) * 0.25;
        this.peak = Math.max(sub, bass, mid, treble);
      } else {
        this.analyser.getByteFrequencyData(this.data);
        const N = this.data.length;
        // Logarithmic-ish band slicing on FFT bins
        const slice = (a, b) => {
          let s = 0, c = 0;
          for (let i = a; i < b; i++) { s += this.data[i]; c++; }
          return c > 0 ? (s / c) / 255 : 0;
        };
        this.bands.sub    = slice(0, 4);
        this.bands.bass   = slice(4, 12);
        this.bands.lowMid = slice(12, 32);
        this.bands.mid    = slice(32, 80);
        this.bands.hiMid  = slice(80, 160);
        this.bands.treble = slice(160, 320);
        this.bands.air    = slice(320, N);
        // Gaussian-weighted energy around 1 kHz
        // K = sum(magnitude(f) * exp(-(f - f0)^2 / (2 sigma^2))) / sum(weights)
        // Adjust SIGMA_HZ to widen or narrow the bell. Smaller = more selective.
        const F0_HZ = 1000;
        const SIGMA_HZ = 250;
        const sr = this.ctx.sampleRate;
        const binHz = sr / (this.analyser.fftSize);
        let kSum = 0, kNorm = 0;
        for (let i = 0; i < N; i++) {
          const f = i * binHz;
          const df = f - F0_HZ;
          const w = Math.exp(-(df * df) / (2 * SIGMA_HZ * SIGMA_HZ));
          if (w < 0.001) continue; // skip negligible weights
          kSum += (this.data[i] / 255) * w;
          kNorm += w;
        }
        this.bands.k1khz = kNorm > 0 ? (kSum / kNorm) : 0;
        // Flat-window energy in 5-8 kHz range (percussive transients zone)
        const F_LO = 5000, F_HI = 8000;
        const binLo = Math.max(0, Math.floor(F_LO / binHz));
        const binHi = Math.min(N, Math.ceil(F_HI / binHz));
        let s58 = 0, c58 = 0;
        for (let i = binLo; i < binHi; i++) { s58 += this.data[i]; c58++; }
        this.bands.k5_8 = c58 > 0 ? (s58 / c58) / 255 : 0;
        this.energy = (this.bands.sub + this.bands.bass + this.bands.mid + this.bands.treble) * 0.25;
        let peak = 0;
        for (let i = 0; i < N; i++) if (this.data[i] / 255 > peak) peak = this.data[i] / 255;
        this.peak = peak;
      }
      // Exponential smoothing
      const k = 0.18;
      for (const key in this.bands) {
        this.smoothed[key] = this.smoothed[key] * (1 - k) + this.bands[key] * k;
      }
      this.smoothed.energy = this.smoothed.energy * 0.92 + this.energy * 0.08;
      this.smoothed.peak = this.smoothed.peak * 0.85 + this.peak * 0.15;
    }
  };

  // ============================================================
  // SMOKE LAYERS
  // Two offscreen canvases, regenerated periodically with
  // domain-warped fractal noise. Tinted bronze. Drift slowly.
  // ============================================================
  const smoke = {
    lo: null, hi: null,
    loCtx: null, hiCtx: null,
    sw: 0, sh: 0,
    offsetLo: 0, offsetHi: 0,
    regen() {
      this._ensureCanvases();
      this._bakeFull('lo', 0.006, 4, 1, trackAtmosphere.current);
      this._bakeFull('hi', 0.018, 3, 1.8, trackAtmosphere.current);
    },
    _ensureCanvases() {
      this.sw = Math.ceil(W / 2);
      this.sh = Math.ceil(H / 2);
      [this.lo, this.hi] = [this.lo || document.createElement('canvas'),
                             this.hi || document.createElement('canvas')];
      [this.lo, this.hi].forEach(c => { c.width = this.sw; c.height = this.sh; });
      this.loCtx = this.lo.getContext('2d');
      this.hiCtx = this.hi.getContext('2d');
    },
    _bakeFull(which, scale, oct, warp, prof) {
      const c = which === 'lo' ? this.loCtx : this.hiCtx;
      const w = this.sw, h = this.sh;
      const img = c.createImageData(w, h);
      const d = img.data;
      const tint = which === 'lo' ? prof.smokeTintLo : prof.smokeTintHi;
      const baseTint = which === 'lo' ? prof.smokeBaseLo : prof.smokeBaseHi;
      const densityMax = which === 'lo' ? prof.smokeDensityLo : prof.smokeDensityHi;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const wx = noise.fbm(x * scale + 100, y * scale, 0, 2) * warp;
          const wy = noise.fbm(x * scale, y * scale + 100, 0, 2) * warp;
          let v = noise.fbm((x + wx * 30) * scale, (y + wy * 30) * scale, 0, oct);
          v = (v + 0.5);
          if (which === 'lo') {
            const grad = 1 - (y / h);
            v *= 0.55 + 0.45 * grad;
          } else {
            v *= 0.4;
          }
          v = Math.max(0, Math.min(1, v));
          const i = (y * w + x) * 4;
          d[i]     = tint[0] + (baseTint[0] - tint[0]) * v;
          d[i + 1] = tint[1] + (baseTint[1] - tint[1]) * v;
          d[i + 2] = tint[2] + (baseTint[2] - tint[2]) * v;
          d[i + 3] = densityMax * v;
        }
      }
      c.putImageData(img, 0, 0);
    },
    _pendingBakes: [],
    ROWS_PER_CHUNK: 12,
    regenWithProfile(prof) {
      this._ensureCanvases();
      this._startIncrementalBake(prof);
    },
    _startIncrementalBake(prof) {
      this._pendingBakes = [
        { which: 'lo', scale: 0.006, oct: 4, warp: 1, prof: this._cloneProf(prof), row: 0, img: null },
        { which: 'hi', scale: 0.018, oct: 3, warp: 1.8, prof: this._cloneProf(prof), row: 0, img: null }
      ];
    },
    _cloneProf(p) {
      return {
        smokeTintLo: [...p.smokeTintLo], smokeBaseLo: [...p.smokeBaseLo],
        smokeTintHi: [...p.smokeTintHi], smokeBaseHi: [...p.smokeBaseHi],
        smokeDensityLo: p.smokeDensityLo, smokeDensityHi: p.smokeDensityHi
      };
    },
    pumpBake() {
      if (this._pendingBakes.length === 0) return;
      const job = this._pendingBakes[0];
      const c = job.which === 'lo' ? this.loCtx : this.hiCtx;
      const w = this.sw, h = this.sh;
      if (!job.img) job.img = c.createImageData(w, h);
      const d = job.img.data;
      const tint = job.which === 'lo' ? job.prof.smokeTintLo : job.prof.smokeTintHi;
      const baseTint = job.which === 'lo' ? job.prof.smokeBaseLo : job.prof.smokeBaseHi;
      const densityMax = job.which === 'lo' ? job.prof.smokeDensityLo : job.prof.smokeDensityHi;
      const endRow = Math.min(job.row + this.ROWS_PER_CHUNK, h);
      for (let y = job.row; y < endRow; y++) {
        for (let x = 0; x < w; x++) {
          const wx = noise.fbm(x * job.scale + 100, y * job.scale, 0, 2) * job.warp;
          const wy = noise.fbm(x * job.scale, y * job.scale + 100, 0, 2) * job.warp;
          let v = noise.fbm((x + wx * 30) * job.scale, (y + wy * 30) * job.scale, 0, job.oct);
          v = (v + 0.5);
          if (job.which === 'lo') {
            const grad = 1 - (y / h);
            v *= 0.55 + 0.45 * grad;
          } else {
            v *= 0.4;
          }
          v = Math.max(0, Math.min(1, v));
          const i = (y * w + x) * 4;
          d[i]     = tint[0] + (baseTint[0] - tint[0]) * v;
          d[i + 1] = tint[1] + (baseTint[1] - tint[1]) * v;
          d[i + 2] = tint[2] + (baseTint[2] - tint[2]) * v;
          d[i + 3] = densityMax * v;
        }
      }
      job.row = endRow;
      if (job.row >= h) {
        c.putImageData(job.img, 0, 0);
        this._pendingBakes.shift();
      }
    },
    draw(t) {
      if (!this.lo) return;
      this.offsetLo += 0.15 + audio.smoothed.sub * 0.4;
      this.offsetHi += 0.05 + audio.smoothed.air * 0.6;
      const yLo = (this.offsetLo % this.sh);
      const yHi = (this.offsetHi % this.sh);
      ctx.globalAlpha = 0.85;
      ctx.drawImage(this.lo, 0, yLo - this.sh, W, H);
      ctx.drawImage(this.lo, 0, yLo, W, H);
      ctx.globalAlpha = 0.55;
      ctx.drawImage(this.hi, 0, yHi - this.sh, W, H);
      ctx.drawImage(this.hi, 0, yHi, W, H);
      ctx.globalAlpha = 1;
    }
  };

  // ============================================================
  // ENTITY
  // 28 vertices on a noise-deformed sphere.
  // Edges drawn between pairs whose 3D distance × audio_factor < threshold.
  // The connection rule never resolves into a recognizable polyhedron.
  // ============================================================
  const entity = {
    N: 28,
    base: [],   // unit-sphere positions
    pos: [],    // current 3D positions after deformation
    proj: [],   // projected 2D + depth
    rot: { x: 0, y: 0, z: 0 },
    init() {
      // Fibonacci sphere distribution
      const phi = Math.PI * (3 - Math.sqrt(5));
      for (let i = 0; i < this.N; i++) {
        const y = 1 - (i / (this.N - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const theta = phi * i;
        this.base.push([Math.cos(theta) * r, y, Math.sin(theta) * r]);
        this.pos.push([0, 0, 0]);
        this.proj.push([0, 0, 0, 0]);
      }
    },
    update(t) {
      // Three irrational rotation rates
      this.rot.x = t * 0.00009;
      this.rot.y = t * 0.00013 * 1.317;
      this.rot.z = t * 0.00007 * 0.831;
      const cx = Math.cos(this.rot.x), sx = Math.sin(this.rot.x);
      const cy = Math.cos(this.rot.y), sy = Math.sin(this.rot.y);
      const cz = Math.cos(this.rot.z), sz = Math.sin(this.rot.z);
      const tt = t * 0.0004;
      const breath = 1 + audio.smoothed.bass * 0.35 + Math.sin(t * 0.0008) * 0.04;
      // During intro, entity is reduced to ~55% of normal size
      const introScale = 1 - presentation.introInfluence * 0.45;
      const baseRadius = Math.min(W, H) * 0.18 * breath * introScale;
      const distort = 0.35 + audio.smoothed.energy * 0.7 + activeMoment.distort;

      for (let i = 0; i < this.N; i++) {
        const b = this.base[i];
        // Per-vertex deformation: 3D noise sampled at (b * scale + time)
        const nx = noise.fbm(b[0] * 1.7 + tt, b[1] * 1.7, b[2] * 1.7, 3) * distort;
        const ny = noise.fbm(b[0] * 1.7, b[1] * 1.7 + tt, b[2] * 1.7, 3) * distort;
        const nz = noise.fbm(b[0] * 1.7, b[1] * 1.7, b[2] * 1.7 + tt, 3) * distort;
        let x = b[0] + nx, y = b[1] + ny, z = b[2] + nz;
        // Rotate: Y then X then Z
        let x1 =  cy * x + sy * z;
        let z1 = -sy * x + cy * z;
        let y1 =  cx * y - sx * z1;
        let z2 =  sx * y + cx * z1;
        let x2 =  cz * x1 - sz * y1;
        let y2 =  sz * x1 + cz * y1;
        this.pos[i][0] = x2 * baseRadius;
        this.pos[i][1] = y2 * baseRadius;
        this.pos[i][2] = z2 * baseRadius;
        // Perspective projection
        const fov = Math.min(W, H) * 0.9;
        const camZ = baseRadius * 3;
        const denom = (camZ - this.pos[i][2]);
        const sx2 = (this.pos[i][0] * fov / denom) + W / 2;
        const sy2 = (this.pos[i][1] * fov / denom) + H / 2;
        this.proj[i][0] = sx2;
        this.proj[i][1] = sy2;
        this.proj[i][2] = this.pos[i][2];
        this.proj[i][3] = denom;
      }
    },
    draw(t) {
      // Edges: for every pair, connect if distance below an audio-modulated threshold.
      // The threshold breathes and occasionally widens for "apparition" moments.
      const baseR = Math.min(W, H) * 0.18;
      const intensity = audio.smoothed.energy + audio.smoothed.bass * 0.5;
      const apparitionBoost = activeMoment.apparition;
      const threshold = baseR * (1.05 + intensity * 0.65 + apparitionBoost * 0.6);

      // Phase shifts the connectivity rule slowly so structures dissolve
      const phaseScale = 0.0001;
      const phase = noise.fbm(t * phaseScale, 0, 0, 2) * 0.3;

      // Curvature parameter: how much each edge bows away from straight.
      // Driven by K1khz (gaussian-weighted energy around 1 kHz).
      // CURVE_MAX is the maximum bow as a fraction of edge length.
      // 34% of pairs are flagged as "aggressive": their curvature is
      // larger, oscillates faster, and is unstable (noise-modulated).
      const CURVE_MAX = 0.35;
      const AGGRESSIVE_FRAC = 0.34;
      const AGGRESSIVE_MULT = 2.5;
      const K = audio.smoothed.k1khz;
      // During intro, all entity opacities are dimmed to ~40%
      const introDim = 1 - presentation.introInfluence * 0.6;

      // Deterministic hash to flag a stable subset of pairs as aggressive
      const isAggressive = (i, j) => {
        const h = (((i + 1) * 73856093) ^ ((j + 1) * 19349663)) >>> 0;
        return (h % 1000) / 1000 < AGGRESSIVE_FRAC;
      };

      ctx.lineCap = 'round';
      for (let i = 0; i < this.N; i++) {
        for (let j = i + 1; j < this.N; j++) {
          const dx = this.pos[i][0] - this.pos[j][0];
          const dy = this.pos[i][1] - this.pos[j][1];
          const dz = this.pos[i][2] - this.pos[j][2];
          const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          // Add a non-obvious modulation per pair so the rule is not pure proximity
          const mod = 1 + phase * Math.sin((i + 1) * (j + 1) * 0.7);
          const eff = d * mod;
          if (eff < threshold) {
            const a = (1 - eff / threshold) * 0.55;
            const z = (this.pos[i][2] + this.pos[j][2]) * 0.5;
            const depthFade = 0.5 + 0.5 * (z / baseR);
            const finalA = Math.max(0.02, a * depthFade) * introDim;
            // Color: bone for the closer/highlighted edges, bronze for the deeper web
            const useBone = depthFade > 0.65 || audio.smoothed.treble > 0.5;
            const c = useBone ? PALETTE.bone : PALETTE.bronzeLit;
            ctx.strokeStyle = rgb(c, finalA);
            ctx.lineWidth = 0.5 + audio.smoothed.treble * 1.2;

            // Curved edge via quadratic Bezier.
            // Calm pairs (66%): slow stable oscillation of sign.
            // Aggressive pairs (34%): faster sign + noise-modulated
            // magnitude + larger maximum bow.
            const x1 = this.proj[i][0], y1 = this.proj[i][1];
            const x2 = this.proj[j][0], y2 = this.proj[j][1];
            const sx = x2 - x1, sy = y2 - y1;
            const segLen = Math.sqrt(sx * sx + sy * sy) || 1;
            const nx = -sy / segLen;
            const ny =  sx / segLen;
            let bow;
            if (isAggressive(i, j)) {
              const fastSign = Math.sin((i + 1) * (j + 1) * 1.371 + t * 0.0025);
              const wobble = noise.n3(i * 0.4 + t * 0.0015, j * 0.4, 0);
              bow = K * segLen * CURVE_MAX * AGGRESSIVE_MULT * fastSign * (1 + Math.abs(wobble) * 0.6);
            } else {
              const slowSign = Math.sin((i + 1) * (j + 1) * 1.371 + t * 0.0002);
              bow = K * segLen * CURVE_MAX * slowSign;
            }
            const cx = (x1 + x2) * 0.5 + nx * bow;
            const cy = (y1 + y2) * 0.5 + ny * bow;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.quadraticCurveTo(cx, cy, x2, y2);
            ctx.stroke();
          }
        }
      }
      // Vertices: respond to overall energy and bass with size and brightness.
      // Bass-driven glow halo emerges on low-end hits. Size growth is modest
      // to avoid the entity feeling inflated.
      const eAvg = audio.smoothed.energy;
      const eBass = audio.smoothed.bass;
      const ePeak = audio.smoothed.peak;
      for (let i = 0; i < this.N; i++) {
        const z = this.pos[i][2];
        const depthFade = 0.4 + 0.6 * ((z + baseR) / (baseR * 2));
        // Size: gentle growth (base 0.9, peak/bass push, energy floor lift)
        const r = (0.9 + ePeak * 1.2 + eBass * 0.7 + eAvg * 0.4) * depthFade;
        // Glow halo on bass pulse (only emerges above a threshold so it
        // reads as a punctuated event, not constant ambient glow).
        // Uses a radial gradient that fades fully to transparent at the
        // edge, so the outer rim is undefined (no hard circle).
        const glow = eBass * 0.7 + ePeak * 0.35;
        if (glow > 0.18) {
          const px = this.proj[i][0], py = this.proj[i][1];
          const haloR = r * (2.8 + glow * 4.2);
          const c = PALETTE.boneLit;
          const peakA = Math.min(1, glow * 0.55) * depthFade * introDim;
          const grad = ctx.createRadialGradient(px, py, 0, px, py, haloR);
          grad.addColorStop(0,    `rgba(${c[0]},${c[1]},${c[2]},${peakA})`);
          grad.addColorStop(0.30, `rgba(${c[0]},${c[1]},${c[2]},${peakA * 0.55})`);
          grad.addColorStop(0.70, `rgba(${c[0]},${c[1]},${c[2]},${peakA * 0.12})`);
          grad.addColorStop(1,    `rgba(${c[0]},${c[1]},${c[2]},0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(px, py, haloR, 0, Math.PI * 2);
          ctx.fill();
        }
        // Core: brightness scales with bass and overall energy
        const coreA = Math.min(1, 0.55 + eBass * 0.4 + eAvg * 0.25) * depthFade * introDim;
        ctx.fillStyle = rgb(PALETTE.boneLit, coreA);
        ctx.beginPath();
        ctx.arc(this.proj[i][0], this.proj[i][1], r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  };

  // ============================================================
  // STRIPES · 5-8 kHz reactive vertical flashes
  // Thin vertical bands of opaque bone-yellow that spawn in
  // response to the 5-8 kHz energy band. Number of active stripes
  // scales with that band's intensity. Each stripe has a short
  // attack-release life (60-180ms), a soft halo on each side, and
  // is distorted vertically by 2D noise so it trembles instead of
  // breaking cleanly.
  // ============================================================
  const stripes = {
    active: [],
    MAX: 5,             // max simultaneous stripes
    SPAWN_GAIN: 0.35,    // base spawn probability per frame at K=1
    update(t) {
      // Suppress stripes during intro and crossfade phases.
      // Also suppress in procedural / no-audio-playing mode: stripes are
      // a reactive layer to real percussive transients, not atmosphere.
      if (presentation.introInfluence > 0 ||
          audio.procedural || !audio.ctx || audio.el.paused) {
        if (this.active.length) this.active = [];
        return;
      }
      // Use raw (un-smoothed) band so transients respond instantly
      const k = audio.bands.k5_8;
      const maxActive = Math.floor(k * this.MAX);
      const spawnProb = k * this.SPAWN_GAIN;
      if (this.active.length < maxActive && Math.random() < spawnProb) {
        this.active.push(this.spawn(t, k));
      }
      // Cull dead
      this.active = this.active.filter(s => t < s.endAt);
    },
    spawn(t, intensity) {
      const x = Math.random() * W;
      const width = 1 + Math.random() * 2;             // 1-3 px
      // Stripe height: sometimes full height, sometimes partial
      const fullHeight = Math.random() < 0.4;
      const heightFrac = fullHeight ? 1 : (0.25 + Math.random() * 0.6);
      const y = fullHeight ? 0 : Math.random() * (H * (1 - heightFrac));
      const dur = 60 + Math.random() * 120;            // 60-180 ms
      // Color variant: weighted random from current track profile.
      // 55% primary, 30% secondary, 15% tertiary stripe color.
      const roll = Math.random();
      const atm = trackAtmosphere.current;
      const color = roll < 0.55 ? atm.stripe1
                  : roll < 0.85 ? atm.stripe2
                                : atm.stripe3;
      return {
        x, width,
        y, h: H * heightFrac,
        startAt: t,
        endAt: t + dur,
        intensity,
        seed: Math.random() * 1000,
        color
      };
    },
    draw(t) {
      if (presentation.introInfluence > 0) return;
      if (audio.procedural || !audio.ctx || audio.el.paused) return;
      if (this.active.length === 0) return;
      ctx.save();
      for (const s of this.active) {
        const age = (t - s.startAt) / (s.endAt - s.startAt);
        // Sharp attack (15%), longer release (85%)
        const env = age < 0.15 ? (age / 0.15) : (1 - (age - 0.15) / 0.85);
        if (env <= 0) continue;
        const alpha = env * 0.85;
        // Halo: horizontal gradient, falls off either side
        const haloW = 10 + s.intensity * 18;
        const grad = ctx.createLinearGradient(s.x - haloW, 0, s.x + haloW, 0);
        const ch = s.color;
        grad.addColorStop(0,   `rgba(${ch[0]},${ch[1]},${ch[2]},0)`);
        grad.addColorStop(0.5, `rgba(${ch[0]},${ch[1]},${ch[2]},${alpha * 0.22})`);
        grad.addColorStop(1,   `rgba(${ch[0]},${ch[1]},${ch[2]},0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(s.x - haloW, s.y, haloW * 2, s.h);
        // Stripe body, distorted by vertical-segment noise jitter.
        // Each 4px slab is shifted in X by noise sampled along the stripe.
        const segH = 4;
        const segs = Math.ceil(s.h / segH);
        const ageT = t * 0.008;
        for (let i = 0; i < segs; i++) {
          const sy = s.y + i * segH;
          // 2D noise gives continuity vertically (the stripe trembles
          // along its length instead of being random pixels)
          const jitter = noise.n3(s.seed + i * 0.18, ageT, 0) * 4 * (0.6 + s.intensity * 0.5);
          // Per-segment opacity wobble for "noisy, not clean" look
          const segA = alpha * (0.65 + 0.35 * noise.n3(s.seed + 33, i * 0.4 + ageT * 1.5, 0));
          ctx.fillStyle = `rgba(${ch[0]},${ch[1]},${ch[2]},${segA})`;
          ctx.fillRect(s.x + jitter, sy, s.width, segH);
        }
      }
      ctx.restore();
    }
  };

  // ============================================================
  // PHANTOMS · ghostly word layer
  // Words from the album lore (75%) and broken code fragments (25%)
  // appear behind everything else, fading in and out with sinusoidal
  // envelopes. Some scale slowly during their lifetime (the "approach").
  // Active window: starts 20s into the audio, closes 120s after the
  // first spawn, so intro and coda remain free of text.
  // ~12% of phantoms exhibit a bug behavior (jitter, char corruption,
  // double render). Most are tiny (5-8px), reading as visual noise.
  // ============================================================
  const phantoms = {
    WORDS: [
      // --- Lore words (75%): from the album's emotional vocabulary ---
      'FRACTURE','HOLLOW','DISSOLVE','ABSENT','TRACE','WHISPER','SHATTERED','DREAMS','MEMORY','BLEED',
      'ECHO','PHANTOM','HEART','RITUAL','ME','DRIFT','SOUL','WET','CONCRETE','ORBIT',
      'ABANDONED','BRIDE','MOON','VEINS','MERCURY','GLASS','CURRENTS','NOCTURNE','MALFORMED','MALFUNCTION',
      'ATLAS','BLOOD','VIRTUAL','GOLD','DUST','PIANO','AGONY','DESCENT','TREMOR','ANXIETY',
      'LUCID','SUFFOCATE','DECAY','WITHDRAWN','THIRST','ALONE','FORGOTTEN','DISAPPEAR','UNREAL','SHUDDER',
      'UNNAMABLE','DEFORMED','ENDLESS','VOICE','SPECTRE','NEON','RAIN','INSIDE','NEVER','WAITING',
      'ISOLATION','DESIRE','WOUND','EMPTY','SILENCE','NIGHT','FEAR','ABSENCE','PAIN','SHADOW',
      'TRAIN','STORM','SKIN','PULSE','ASH','BONE','PRESENCE','IMMENSE','INDIFFERENT','NOTHING',
      'NOBODY','LOST','MIRROR','BREATHE','BROKEN','INCOMPLETE','DARK','COLD','SMOKE','STILL',
      // --- Broken code fragments (25%): old systems failure language ---
      'NULL','VOID','0xFF','0x00','SEGFAULT','ORPHAN','HOME','DANGLING','FAULT','PANIC',
      'ABORT!','SIGSEGV','KERNEL','FATAL','HALT','GOTO','REM','DIM','POKE','PEEK',
      '0xDEAD','0xBEEF','0xBADF00D','/dev/null','EXIT 139','PIPE BROKEN','RECURSION','UNCAUGHT','KILL -9','CORE DUMPED'
    ],
    BUG_GLYPHS: ['▓','░','▒','│','┤','└','┴','▀','■','▪','▌','▐'],
    COLOR_GREEN: [120, 195, 110],
    COLOR_YELLOW: [210, 200, 130],

    // Tunable parameters
    START_DELAY: 20,           // seconds into the audio before first appearance
    CODA_GUARD: 20,            // close the window when fewer than N seconds remain
    MAX_ACTIVE: 10,
    MIN_LIFE_S: 1.0,
    MAX_LIFE_S: 7.0,
    SPAWN_PROB: 0.08,          // per-frame spawn probability
    MAX_PLACE_ATTEMPTS: 8,
    YELLOW_PROB: 0.20,         // 20% pale yellow, 80% console green
    APPROACH_PROB: 0.35,       // 35% scale slowly during life
    BUG_PROB: 0.15,            // 15% exhibit a bug behavior
    PEAK_ALPHA: 0.55,

    active: [],
    _lastAudioTime: 0,

    reset() {
      this.active = [];
      this._lastAudioTime = 0;
    },
    pickFontSize() {
      // Skewed distribution: most words are tiny (barely legible).
      const r = Math.random();
      if (r < 0.50) return 5 + Math.floor(Math.random() * 4);   //  5-8 px
      if (r < 0.85) return 9 + Math.floor(Math.random() * 3);   //  9-11 px
      return 12 + Math.floor(Math.random() * 3);                // 12-14 px
    },
    corruptWord(w) {
      const n = 1 + Math.floor(Math.random() * 2);
      const chars = w.split('');
      for (let i = 0; i < n; i++) {
        const idx = Math.floor(Math.random() * chars.length);
        chars[idx] = this.BUG_GLYPHS[Math.floor(Math.random() * this.BUG_GLYPHS.length)];
      }
      return chars.join('');
    },
    overlaps(x, y, w, h) {
      for (const p of this.active) {
        const sc = Math.max(p.startScale, p.endScale);
        const pw = p.w * sc, ph = p.h * sc;
        const px = p.x - (pw - p.w) * 0.5;
        const py = p.y - (ph - p.h) * 0.5;
        if (x < px + pw && x + w > px && y < py + ph && y + h > py) return true;
      }
      return false;
    },
    trySpawn(ct) {
      const word = this.WORDS[Math.floor(Math.random() * this.WORDS.length)];
      const fs = this.pickFontSize();
      const family = "'Courier New', 'Lucida Console', 'Monaco', monospace";
      ctx.save();
      ctx.font = `${fs}px ${family}`;
      const tw = ctx.measureText(word).width;
      ctx.restore();
      const th = fs * 1.3;
      const pad = 8;

      // Try several positions to avoid overlap
      let x = 0, y = 0, placed = false;
      for (let i = 0; i < this.MAX_PLACE_ATTEMPTS; i++) {
        x = pad + Math.random() * Math.max(1, W - tw - pad * 2);
        y = pad + Math.random() * Math.max(1, H - th - pad * 2);
        if (!this.overlaps(x, y, tw + pad, th + pad)) { placed = true; break; }
      }
      if (!placed) return;

      const color = Math.random() < this.YELLOW_PROB ? this.COLOR_YELLOW : this.COLOR_GREEN;
      const lifeS = this.MIN_LIFE_S + Math.random() * (this.MAX_LIFE_S - this.MIN_LIFE_S);

      let bug = null;
      if (Math.random() < this.BUG_PROB) {
        const r = Math.random();
        bug = r < 0.40 ? 'jitter' : r < 0.75 ? 'corrupt' : 'double';
      }
      const approach = Math.random() < this.APPROACH_PROB;
      const startScale = approach ? 0.82 : 1.0;
      const endScale   = approach ? 1.20 : 1.0;

      this.active.push({
        word: bug === 'corrupt' ? this.corruptWord(word) : word,
        x, y, w: tw, h: th,
        fontSize: fs, family,
        color,
        audioStart: ct,
        audioEnd: ct + lifeS,
        bug, approach, startScale, endScale
      });
    },
    update(t) {
      if (audio.procedural || !audio.ctx || audio.el.paused) return;
      const ct = audio.el.currentTime;
      // Backward-seek detection: full reset
      if (ct < this._lastAudioTime - 1) this.reset();
      this._lastAudioTime = ct;

      if (ct < this.START_DELAY) return;
      // Cull dead
      this.active = this.active.filter(p => p.audioEnd > ct);
      // Window: closes when fewer than CODA_GUARD seconds remain in the track,
      // preserving an untouched coda regardless of track length. Falls back
      // gracefully when duration metadata is not yet available (NaN).
      const dur = audio.el.duration;
      if (isFinite(dur) && dur > 0 && (dur - ct) <= this.CODA_GUARD) return;
      // Spawn attempt
      if (this.active.length < this.MAX_ACTIVE && Math.random() < this.SPAWN_PROB) {
        this.trySpawn(ct);
      }
    },
    draw(t) {
      if (this.active.length === 0) return;
      if (!audio.ctx || audio.procedural) return;
      const ct = audio.el.currentTime;
      ctx.save();
      ctx.textBaseline = 'alphabetic';
      for (const p of this.active) {
        const dur = p.audioEnd - p.audioStart;
        const prog = (ct - p.audioStart) / dur;
        if (prog < 0 || prog > 1) continue;
        // Symmetric sinusoidal fade in/out, never reaches 1.0
        const env = Math.sin(prog * Math.PI);
        const alpha = env * this.PEAK_ALPHA;
        const scale = p.startScale + (p.endScale - p.startScale) * prog;
        const cx = p.x + p.w * 0.5;
        const cy = p.y + p.h * 0.7;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.translate(-cx, -cy);
        let jx = 0, jy = 0;
        if (p.bug === 'jitter') {
          jx = (Math.random() - 0.5) * 3;
          jy = (Math.random() - 0.5) * 1.5;
        }
        ctx.font = `${p.fontSize}px ${p.family}`;
        const c = p.color;
        if (p.bug === 'double') {
          ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha * 0.45})`;
          ctx.fillText(p.word, p.x + 1.5 + jx, p.y + p.h * 0.8 + 1 + jy);
        }
        ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
        ctx.fillText(p.word, p.x + jx, p.y + p.h * 0.8 + jy);
        ctx.restore();
      }
      ctx.restore();
    }
  };

  // ============================================================
  // FILTER · BROKEN-CAMERA EFFECTS
  // - Asymmetric two-tone aberration (bone vs bronze, not RGB)
  // - Breathing grain
  // - Freeze-frame regions (snapshot a rect, hold 80-160ms)
  // - Brief "tear" glitches on cue
  // ============================================================
  const filter = {
    snapshot: null,
    snapCtx: null,
    freezes: [],
    nextFreezeAt: 0,
    grainCanvas: null,
    grainCtx: null,
    grainPattern: null,
    init() {
      this.snapshot = document.createElement('canvas');
      this.snapCtx = this.snapshot.getContext('2d');
      this.grainCanvas = document.createElement('canvas');
      this.grainCtx = this.grainCanvas.getContext('2d');
      this.regrain();
    },
    regrain() {
      const s = 256;
      this.grainCanvas.width = s;
      this.grainCanvas.height = s;
      const img = this.grainCtx.createImageData(s, s);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.random() * 255;
        d[i] = v; d[i + 1] = v; d[i + 2] = v;
        d[i + 3] = 18;
      }
      this.grainCtx.putImageData(img, 0, 0);
    },
    applyAberration() {
      // Subtle asymmetric two-tone offset by re-stamping the canvas
      // with bone tint and bronze tint at slight different vectors.
      const ox = (noise.n3(performance.now() * 0.0003, 0, 0)) * 1.4;
      const oy = (noise.n3(0, performance.now() * 0.0003, 0)) * 1.0;
      const intensity = 0.10 + audio.smoothed.peak * 0.18 + activeMoment.tear * 0.4;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = intensity;
      ctx.filter = 'brightness(0.6)';
      // Bone-side ghost
      ctx.drawImage(canvas, ox * 1.3, oy * 0.7);
      // Bronze-side ghost (opposite vector, smaller)
      ctx.drawImage(canvas, -ox * 0.8, -oy * 1.4);
      ctx.filter = 'none';
      ctx.restore();
    },
    applyGrain(t) {
      ctx.save();
      const breath = 0.10 + audio.smoothed.energy * 0.15;
      ctx.globalAlpha = breath;
      ctx.globalCompositeOperation = 'overlay';
      // Tile grain
      if (!this.grainPattern) this.grainPattern = ctx.createPattern(this.grainCanvas, 'repeat');
      ctx.fillStyle = this.grainPattern;
      // Random offset per frame so grain "moves"
      const ox = Math.floor(Math.random() * 256);
      const oy = Math.floor(Math.random() * 256);
      ctx.translate(-ox, -oy);
      ctx.fillRect(0, 0, W + 256, H + 256);
      ctx.restore();
      // Re-bake grain occasionally so it doesn't look static
      if (Math.random() < 0.05) {
        this.regrain();
        this.grainPattern = ctx.createPattern(this.grainCanvas, 'repeat');
      }
    },
    handleFreezes(t) {
      // Spawn new freezes on a randomized schedule
      if (t > this.nextFreezeAt) {
        this.spawnFreeze();
        const interval = 4000 + Math.random() * 8000 - audio.smoothed.energy * 1500;
        this.nextFreezeAt = t + Math.max(2500, interval);
      }
      // Resize snapshot canvas if needed
      if (this.snapshot.width !== W || this.snapshot.height !== H) {
        this.snapshot.width = W;
        this.snapshot.height = H;
      }
      // Capture current frame state into snapshot
      this.snapCtx.drawImage(canvas, 0, 0, W, H);
      // Draw active freezes
      const now = t;
      this.freezes = this.freezes.filter(f => now < f.endAt);
      for (const f of this.freezes) {
        const age = (now - f.startAt) / (f.endAt - f.startAt);
        const a = age < 0.8 ? 1 : (1 - (age - 0.8) / 0.2);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.drawImage(f.cap,
                      0, 0, f.w, f.h,
                      f.x, f.y, f.w, f.h);
        // Slight bronze tint over freeze region
        ctx.fillStyle = rgb(PALETTE.bronze, 0.08);
        ctx.fillRect(f.x, f.y, f.w, f.h);
        ctx.restore();
      }
    },
    spawnFreeze() {
      const fw = 80 + Math.random() * 280;
      const fh = 50 + Math.random() * 200;
      const fx = Math.random() * (W - fw);
      const fy = Math.random() * (H - fh);
      const cap = document.createElement('canvas');
      cap.width = fw;
      cap.height = fh;
      cap.getContext('2d').drawImage(canvas, fx, fy, fw, fh, 0, 0, fw, fh);
      const dur = 80 + Math.random() * 180;
      this.freezes.push({
        x: fx, y: fy, w: fw, h: fh,
        cap,
        startAt: performance.now(),
        endAt: performance.now() + dur
      });
    },
    applyTear() {
      if (activeMoment.tear < 0.05) return;
      const slices = 4 + Math.floor(activeMoment.tear * 12);
      for (let i = 0; i < slices; i++) {
        const sy = Math.random() * H;
        const sh = 4 + Math.random() * 24;
        const dx = (Math.random() - 0.5) * activeMoment.tear * 80;
        ctx.drawImage(canvas, 0, sy, W, sh, dx, sy, W, sh);
      }
    },
    apply(t) {
      this.applyAberration();
      this.handleFreezes(t);
      this.applyTear();
      this.applyGrain(t);
    }
  };

  // ============================================================
  // SCRIPTED MOMENT MANAGER
  // ============================================================
  const activeMoment = {
    distort: 0,
    apparition: 0,
    tear: 0,
    silence: 0
  };
  const momentEnvelope = (elapsed, duration) => {
    // Smooth in-out envelope (0 to 1 to 0 over duration)
    const x = elapsed / duration;
    if (x < 0 || x > 1) return 0;
    return Math.sin(x * Math.PI);
  };
  function updateMoments() {
    activeMoment.distort = 0;
    activeMoment.apparition = 0;
    activeMoment.tear = 0;
    activeMoment.silence = 0;
    if (!audio.el || audio.procedural) return;
    const ct = audio.el.currentTime;
    for (const m of MOMENTS) {
      const elapsed = (ct - m.t) * 1000;
      if (elapsed < 0 || elapsed > m.d) continue;
      const env = momentEnvelope(elapsed, m.d) * m.strength;
      switch (m.type) {
        case 'collapse':   activeMoment.distort    = Math.max(activeMoment.distort, env);    break;
        case 'apparition': activeMoment.apparition = Math.max(activeMoment.apparition, env); break;
        case 'tear':       activeMoment.tear       = Math.max(activeMoment.tear, env);       break;
        case 'silence':    activeMoment.silence    = Math.max(activeMoment.silence, env);    break;
      }
    }
  }

  // ============================================================
  // MAIN LOOP
  // ============================================================
  function frame(t) {
    audio.sample();
    presentation.update(t);
    updateMoments();

    // Atmosphere interpolation
    trackAtmosphere.update(t);
    smoke.pumpBake();
    const atm = trackAtmosphere.current;

    // Background void — uses track profile color
    ctx.fillStyle = rgb(atm.voidColor);
    ctx.fillRect(0, 0, W, H);

    // Vignette pulse — uses track profile colors and intensities
    const vign = ctx.createRadialGradient(W / 2, H / 2, 0,
                                          W / 2, H / 2, Math.max(W, H) * 0.7);
    vign.addColorStop(0, rgb(atm.vigCenterColor, atm.vigCenterAlpha + audio.smoothed.bass * 0.2));
    vign.addColorStop(0.6, rgb(atm.voidColor, 0.0));
    vign.addColorStop(1, rgb(atm.voidColor, atm.vigEdgeAlpha));
    ctx.fillStyle = vign;
    ctx.fillRect(0, 0, W, H);

    phantoms.update(t);
    phantoms.draw(t);
    smoke.draw(t);
    entity.update(t);
    entity.draw(t);
    stripes.update(t);
    stripes.draw(t);
    filter.apply(t);

    // Silence moment: deep fade (uses track atmosphere void)
    if (activeMoment.silence > 0) {
      ctx.fillStyle = rgb(atm.voidColor, activeMoment.silence * 0.7);
      ctx.fillRect(0, 0, W, H);
    }

    requestAnimationFrame(frame);
  }

  // ============================================================
  // INIT
  // ============================================================
  function start() {
    resize();
    trackAtmosphere.init();
    smoke.regen();
    entity.init();
    filter.init();
    requestAnimationFrame(frame);
  }

  // ============================================================
  // UI HANDLERS
  // ============================================================
  const playBtn = document.getElementById('play-btn');
  const repeatBtn = document.getElementById('repeat-btn');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const progress = document.getElementById('progress');
  const progressFill = document.getElementById('progress-fill');
  const progressHead = document.getElementById('progress-head');
  const elapsedEl = document.getElementById('time-elapsed');
  const remainingEl = document.getElementById('time-remaining');

  // Build tracklist DOM
  playlist.render();
  playlist.refreshUI();

  // Play/pause: also auto-loads first track if none loaded
  playBtn.addEventListener('click', () => {
    if (playlist.currentIndex < 0) {
      playlist.load(0, true);
      playBtn.textContent = '❚❚ Pause';
      return;
    }
    if (audio.el.paused) {
      audio.init();
      audio.el.play().catch(() => {});
      playBtn.textContent = '❚❚ Pause';
    } else {
      audio.el.pause();
      playBtn.textContent = '▶ Play';
    }
  });

  prevBtn.addEventListener('click', () => {
    if (playlist.currentIndex > 0) {
      playlist.load(playlist.currentIndex - 1, !audio.el.paused);
    } else {
      playlist.load(playlist.tracks.length - 1, !audio.el.paused);
    }
  });

  nextBtn.addEventListener('click', () => {
    if (playlist.currentIndex < playlist.tracks.length - 1) {
      playlist.load(playlist.currentIndex + 1, !audio.el.paused);
    } else {
      playlist.load(0, !audio.el.paused);
    }
  });

  repeatBtn.addEventListener('click', () => playlist.cycleRepeat());

  // Mobile play button
  const mobilePlayBtn = document.getElementById('mobile-play-btn');
  mobilePlayBtn.addEventListener('click', () => {
    if (playlist.currentIndex < 0) {
      playlist.load(0, true);
      return;
    }
    if (audio.el.paused) {
      audio.init();
      audio.el.play().catch(() => {});
    } else {
      audio.el.pause();
    }
  });

  const controlsWrap = document.getElementById('controls-wrap');
  const tracklistEl  = document.getElementById('tracklist');

  audio.el.addEventListener('play',  () => {
    playBtn.textContent = '❚❚ Pause';
    mobilePlayBtn.textContent = '❚❚ pause';
    if (!isMobile) {
      controlsWrap.classList.add('dimmed');
      tracklistEl.classList.add('dimmed');
    }
  });
  audio.el.addEventListener('pause', () => {
    playBtn.textContent = '▶ Play';
    mobilePlayBtn.textContent = '▶ play';
    if (!isMobile) {
      controlsWrap.classList.remove('dimmed');
      tracklistEl.classList.remove('dimmed');
    }
  });
  audio.el.addEventListener('ended', () => playlist.onEnded());

  audio.el.addEventListener('timeupdate', () => {
    const dur = audio.el.duration;
    const ct = audio.el.currentTime;
    if (!isFinite(dur) || dur <= 0) {
      elapsedEl.textContent = fmtTime(ct);
      remainingEl.textContent = '-0:00';
      return;
    }
    const pct = (ct / dur) * 100;
    progressFill.style.width = pct + '%';
    progressHead.style.left = pct + '%';
    elapsedEl.textContent = fmtTime(ct);
    remainingEl.textContent = '-' + fmtTime(Math.max(0, dur - ct));
  });

  audio.el.addEventListener('loadedmetadata', () => {
    if (isFinite(audio.el.duration)) {
      remainingEl.textContent = '-' + fmtTime(audio.el.duration);
    }
  });

  progress.addEventListener('click', e => {
    if (!isFinite(audio.el.duration) || audio.el.duration <= 0) return;
    const r = progress.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    audio.el.currentTime = pct * audio.el.duration;
  });

  function fmtTime(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
    else if (e.code === 'KeyF') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
    else if (e.code === 'KeyR') repeatBtn.click();
    else if (e.code === 'ArrowRight' && playlist.currentIndex >= 0) {
      playlist.load(Math.min(playlist.currentIndex + 1, playlist.tracks.length - 1), !audio.el.paused);
    }
    else if (e.code === 'ArrowLeft' && playlist.currentIndex >= 0) {
      playlist.load(Math.max(playlist.currentIndex - 1, 0), !audio.el.paused);
    }
  });

  // Mobile: reveal tracklist on scroll, hide hint
  if (isMobile) {
    let scrollHintHidden = false;
    const tracklistEl = document.getElementById('tracklist');
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY || window.pageYOffset;
      if (scrollY > 40 && !scrollHintHidden) {
        scrollHintHidden = true;
        document.getElementById('scroll-hint').classList.remove('visible');
      }
      if (scrollY > 20) {
        tracklistEl.classList.add('visible');
      }
    }, { passive: true });
  }

  // Kick off the intro phase
  presentation.init();

  start();
})();
</script>
